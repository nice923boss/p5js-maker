<script>
// P5M core: math, easing, colors, seeded random/noise, keyframes, clip timing and the type registry.
// Shared by the editor and the exported player. Classic script; everything hangs off window.P5M.
(function () {
  const P5M = (window.P5M = window.P5M || {});

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, p) => a + (b - a) * p;
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a), 0, 1));
  const rad = (deg) => (deg * Math.PI) / 180;

  // ---------- easing ----------
  const backOut = (p) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const bounceOut = (p) => {
    const n = 7.5625, d = 2.75;
    if (p < 1 / d) return n * p * p;
    if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75;
    if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375;
    return n * (p -= 2.625 / d) * p + 0.984375;
  };
  const EASE = {
    linear: (p) => p,
    easeIn: (p) => p * p * p,
    easeOut: (p) => 1 - Math.pow(1 - p, 3),
    easeInOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    sine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
    backOut,
    backIn: (p) => 1 - backOut(1 - p),
    elastic: (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
    bounce: bounceOut,
    hold: (p) => (p >= 1 ? 1 : 0),
  };
  const EASE_LABELS = {
    linear: '線性', easeIn: '漸快', easeOut: '漸慢', easeInOut: '慢快慢', sine: '柔和',
    backOut: '回彈', backIn: '蓄力', elastic: '彈簧', bounce: '落地彈跳', hold: '瞬間切換',
  };
  const ease = (name, p) => (EASE[name] || EASE.easeInOut)(clamp(p, 0, 1));

  // ---------- colors ----------
  const colorCache = new Map();
  function parseColor(c) {
    if (Array.isArray(c)) return [c[0], c[1], c[2], c[3] === undefined ? 1 : c[3]];
    const key = String(c || '#000000');
    const hit = colorCache.get(key);
    if (hit) return hit;
    let out = [0, 0, 0, 1];
    const s = key.trim();
    if (s[0] === '#') {
      const h = s.length === 4 || s.length === 5 ? [...s.slice(1)].map((x) => x + x).join('') : s.slice(1);
      out = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),
        h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
    } else {
      const m = s.match(/rgba?\(([^)]+)\)/i);
      if (m) {
        const v = m[1].split(',').map((x) => parseFloat(x));
        out = [v[0], v[1], v[2], v[3] === undefined ? 1 : v[3]];
      }
    }
    colorCache.set(key, out);
    return out;
  }
  const rgba = (c, alphaMul = 1) => {
    const [r, g, b, a] = parseColor(c);
    return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${+(a * alphaMul).toFixed(4)})`;
  };
  const hex2 = (v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0');
  function toHex(c) {
    const [r, g, b, a] = parseColor(c);
    return '#' + hex2(r) + hex2(g) + hex2(b) + (a < 1 ? hex2(a * 255) : '');
  }
  function mixColor(a, b, p) {
    const x = parseColor(a), y = parseColor(b);
    return toHex([lerp(x[0], y[0], p), lerp(x[1], y[1], p), lerp(x[2], y[2], p), lerp(x[3], y[3], p)]);
  }
  const isColor = (v) => typeof v === 'string' && (v[0] === '#' || v.startsWith('rgb'));

  // ---------- seeded random and noise ----------
  // Stateless hash: same (n, seed) always gives the same number in [0, 1)
  function hash(n, seed = 0) {
    let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((seed | 0) + 0x632be5ab, 0xc2b2ae35);
    x ^= x >>> 16; x = Math.imul(x, 0x7feb352d);
    x ^= x >>> 15; x = Math.imul(x, 0x846ca68b);
    x ^= x >>> 16;
    return (x >>> 0) / 4294967296;
  }
  // Sequential generator for setup-time lists (mulberry32)
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // 3D gradient noise in [0, 1], seeded, independent of p5's global noiseSeed
  const permCache = new Map();
  function perm(seed) {
    let p = permCache.get(seed);
    if (p) return p;
    const r = rng(seed * 7919 + 17);
    const base = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [base[i], base[j]] = [base[j], base[i]]; }
    p = new Uint8Array(512);
    for (let i = 0; i < 512; i++) p[i] = base[i & 255];
    permCache.set(seed, p);
    return p;
  }
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  function grad(h, x, y, z) {
    const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  function noise(x, y = 0, z = 0, seed = 0) {
    const p = perm(seed);
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    const n = lerp(
      lerp(lerp(grad(p[AA] & 15, x, y, z), grad(p[BA] & 15, x - 1, y, z), u),
        lerp(grad(p[AB] & 15, x, y - 1, z), grad(p[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[AA + 1] & 15, x, y, z - 1), grad(p[BA + 1] & 15, x - 1, y, z - 1), u),
        lerp(grad(p[AB + 1] & 15, x, y - 1, z - 1), grad(p[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
    return clamp(n * 0.5 + 0.5, 0, 1);
  }

  // ---------- keyframes ----------
  // keys: [{ t, v, e }] sorted by t (clip-local seconds); e = easing from this key to the next
  function mixValue(a, b, p) {
    if (typeof a === 'number' && typeof b === 'number') return lerp(a, b, p);
    if (isColor(a) && isColor(b)) return mixColor(a, b, p);
    return p < 1 ? a : b;
  }
  function sampleKeys(keys, t) {
    if (t <= keys[0].t) return keys[0].v;
    const last = keys[keys.length - 1];
    if (t >= last.t) return last.v;
    let i = 0;
    while (i < keys.length - 2 && keys[i + 1].t <= t) i++;
    const a = keys[i], b = keys[i + 1];
    return mixValue(a.v, b.v, ease(a.e, seg(t, a.t, b.t)));
  }

  // ---------- type registry ----------
  // def = { label, category, icon, screen?, audio?, props: [{ key, label, type, default, ... }], draw, bounds }
  const types = {};
  const COMMON_VISUAL = [
    { key: 'x', label: 'X', type: 'number', step: 1, group: 'transform', anim: true },
    { key: 'y', label: 'Y', type: 'number', step: 1, group: 'transform', anim: true },
    { key: 'scale', label: '縮放', type: 'number', step: 0.01, min: 0, default: 1, group: 'transform', anim: true },
    { key: 'rotation', label: '旋轉', type: 'number', step: 1, default: 0, unit: '°', group: 'transform', anim: true },
    { key: 'opacity', label: '不透明度', type: 'range', min: 0, max: 1, step: 0.01, default: 1, group: 'transform', anim: true },
  ];
  const FILTER_PROPS = [
    { key: 'blur', label: '模糊', type: 'range', min: 0, max: 40, step: 0.5, default: 0, group: 'filter', anim: true },
    { key: 'brightness', label: '亮度', type: 'range', min: 0, max: 3, step: 0.01, default: 1, group: 'filter', anim: true },
    { key: 'contrast', label: '對比', type: 'range', min: 0, max: 3, step: 0.01, default: 1, group: 'filter', anim: true },
    { key: 'saturate', label: '飽和度', type: 'range', min: 0, max: 3, step: 0.01, default: 1, group: 'filter', anim: true },
    { key: 'hue', label: '色相', type: 'range', min: -180, max: 180, step: 1, default: 0, unit: '°', group: 'filter', anim: true },
  ];
  function registerType(name, def) {
    const props = def.screen || def.audio ? def.props || [] : [...COMMON_VISUAL, ...(def.props || []), ...FILTER_PROPS];
    types[name] = { name, ...def, props };
  }
  function defaultProps(type, settings) {
    const def = types[type];
    const out = {};
    for (const pd of def.props) {
      if (pd.key === 'x') out.x = settings.width / 2;
      else if (pd.key === 'y') out.y = settings.height / 2;
      else if (pd.default !== undefined) out[pd.key] = typeof pd.default === 'function' ? pd.default(settings) : pd.default;
    }
    return out;
  }

  // ---------- clip timing ----------
  const clipEnd = (c) => c.start + c.duration;
  const isActive = (c, t) => t >= c.start && t < c.start + c.duration;
  const localTime = (c, t) => t - c.start + (c.offset || 0);

  // Resolved props at clip-local time lt: defaults <- props <- keyframes
  function resolveProps(clip, lt, settings) {
    const def = types[clip.type];
    const out = {};
    if (def) for (const pd of def.props) if (pd.default !== undefined) out[pd.key] = typeof pd.default === 'function' ? pd.default(settings) : pd.default;
    if (def && !def.screen && !def.audio) { out.x = settings.width / 2; out.y = settings.height / 2; }
    Object.assign(out, clip.props);
    if (clip.keys) for (const k in clip.keys) if (clip.keys[k] && clip.keys[k].length) out[k] = sampleKeys(clip.keys[k], lt);
    return out;
  }

  const fmtTime = (s) => {
    const neg = s < 0; s = Math.abs(s);
    const m = Math.floor(s / 60), sec = s - m * 60;
    return (neg ? '-' : '') + String(m).padStart(2, '0') + ':' + sec.toFixed(2).padStart(5, '0');
  };
  const uid = (prefix = 'id') => prefix + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);

  Object.assign(P5M, {
    VERSION: 1, clamp, lerp, seg, rad, EASE, EASE_LABELS, ease,
    parseColor, rgba, toHex, mixColor, isColor, hash, rng, noise,
    mixValue, sampleKeys, types, registerType, defaultProps,
    clipEnd, isActive, localTime, resolveProps, fmtTime, uid,
  });
})();

<script>
// In / out / loop animation presets (CapCut-style one-click animations).
// clip.anim = { in: { type, dur }, out: { type, dur }, loop: { type, speed, amount } }
// animState() returns the offsets the renderer applies on top of the (keyframed) props.
(function () {
  const P5M = window.P5M;
  const { ease, seg, hash, noise, clamp } = P5M;

  // Per-glyph stagger: glyph i of n animates inside its own window of progress p
  function glyphP(p, i, n, width = 0.45) {
    const start = n > 1 ? ((1 - width) * i) / (n - 1) : 0;
    return seg(p, start, start + width);
  }

  // Each entry: label, dur (default seconds), text (text-only), apply(state, p, env)
  // p runs 0 -> 1 for "in" (0 = hidden, 1 = settled); "out" presets get p 0 -> 1 as the clip leaves.
  const IN = {
    none: { label: '無', apply() {} },
    fade: { label: '淡入', dur: 0.6, apply: (s, p) => { s.alpha *= ease('easeOut', p); } },
    slideLeft: { label: '左側滑入', dur: 0.7, apply: (s, p, e) => { const q = ease('easeOut', p); s.dx -= (1 - q) * e.W * 0.25; s.alpha *= Math.min(1, p * 2); } },
    slideRight: { label: '右側滑入', dur: 0.7, apply: (s, p, e) => { const q = ease('easeOut', p); s.dx += (1 - q) * e.W * 0.25; s.alpha *= Math.min(1, p * 2); } },
    slideUp: { label: '下方升起', dur: 0.7, apply: (s, p, e) => { const q = ease('easeOut', p); s.dy += (1 - q) * e.H * 0.25; s.alpha *= Math.min(1, p * 2); } },
    slideDown: { label: '上方落下', dur: 0.7, apply: (s, p, e) => { const q = ease('easeOut', p); s.dy -= (1 - q) * e.H * 0.25; s.alpha *= Math.min(1, p * 2); } },
    zoomIn: { label: '放大出現', dur: 0.6, apply: (s, p) => { const q = ease('easeOut', p); s.sx *= q; s.sy *= q; s.alpha *= Math.min(1, p * 3); } },
    zoomOut: { label: '縮小出現', dur: 0.7, apply: (s, p) => { const k = 1 + (1 - ease('easeOut', p)) * 0.8; s.sx *= k; s.sy *= k; s.alpha *= ease('easeOut', p); } },
    pop: { label: '彈出', dur: 0.6, apply: (s, p) => { const q = p <= 0 ? 0 : ease('backOut', p); s.sx *= q; s.sy *= q; } },
    drop: { label: '掉落彈跳', dur: 0.9, apply: (s, p, e) => { s.dy -= (1 - ease('bounce', p)) * e.H * 0.4; s.alpha *= Math.min(1, p * 4); } },
    spin: { label: '旋轉出現', dur: 0.8, apply: (s, p) => { const q = ease('easeOut', p); s.rot -= (1 - q) * 270; s.sx *= q; s.sy *= q; } },
    flip: { label: '翻轉', dur: 0.6, apply: (s, p) => { s.sx *= Math.sin(ease('easeOut', p) * Math.PI / 2); } },
    blur: { label: '模糊淡入', dur: 0.8, apply: (s, p) => { const q = ease('easeOut', p); s.blur += (1 - q) * 24; s.alpha *= q; } },
    wipe: { label: '擦除展開', dur: 0.8, apply: (s, p) => { s.reveal = { dir: 'right', p: ease('easeInOut', p) }; } },
    iris: { label: '圓形展開', dur: 0.8, apply: (s, p) => { s.reveal = { dir: 'iris', p: ease('easeInOut', p) }; } },
    typewriter: { label: '打字機', dur: 1.2, text: true, apply: (s, p) => { s.glyphs.push((g, i, n) => { if (glyphP(p, i, n, 0.02) <= 0) g.alpha = 0; }); } },
    stamp: { label: '逐字蓋章', dur: 1.4, text: true, apply: (s, p) => {
      s.glyphs.push((g, i, n) => { const q = glyphP(p, i, n, 0.35); g.s *= 1 + (1 - ease('easeOut', q)) * 0.6; g.alpha *= Math.min(1, q * 2.5); });
    } },
    rise: { label: '逐字升起', dur: 1.2, text: true, apply: (s, p) => {
      s.glyphs.push((g, i, n) => { const q = glyphP(p, i, n, 0.5); g.dy += (1 - ease('easeOut', q)) * 48; g.alpha *= q; });
    } },
    bounceIn: { label: '逐字彈跳', dur: 1.2, text: true, apply: (s, p) => {
      s.glyphs.push((g, i, n) => { const q = glyphP(p, i, n, 0.4); const k = q <= 0 ? 0 : ease('backOut', q); g.s *= k; });
    } },
  };

  const OUT = {
    none: { label: '無', apply() {} },
    fade: { label: '淡出', dur: 0.6, apply: (s, p) => { s.alpha *= 1 - ease('easeIn', p); } },
    slideLeft: { label: '向左滑出', dur: 0.7, apply: (s, p, e) => { s.dx -= ease('easeIn', p) * e.W * 0.25; s.alpha *= 1 - Math.max(0, p * 2 - 1); } },
    slideRight: { label: '向右滑出', dur: 0.7, apply: (s, p, e) => { s.dx += ease('easeIn', p) * e.W * 0.25; s.alpha *= 1 - Math.max(0, p * 2 - 1); } },
    slideUp: { label: '向上飄走', dur: 0.7, apply: (s, p, e) => { s.dy -= ease('easeIn', p) * e.H * 0.25; s.alpha *= 1 - Math.max(0, p * 2 - 1); } },
    slideDown: { label: '向下落下', dur: 0.7, apply: (s, p, e) => { s.dy += ease('easeIn', p) * e.H * 0.25; s.alpha *= 1 - Math.max(0, p * 2 - 1); } },
    zoomOut: { label: '縮小消失', dur: 0.6, apply: (s, p) => { const q = 1 - ease('easeIn', p); s.sx *= q; s.sy *= q; } },
    zoomIn: { label: '放大消失', dur: 0.6, apply: (s, p) => { const k = 1 + ease('easeIn', p) * 0.8; s.sx *= k; s.sy *= k; s.alpha *= 1 - p; } },
    pop: { label: '收回', dur: 0.5, apply: (s, p) => { const q = p >= 1 ? 0 : ease('backOut', 1 - p); s.sx *= q; s.sy *= q; } },
    spin: { label: '旋轉消失', dur: 0.8, apply: (s, p) => { const q = ease('easeIn', p); s.rot += q * 270; s.sx *= 1 - q; s.sy *= 1 - q; } },
    flip: { label: '翻轉', dur: 0.6, apply: (s, p) => { s.sx *= Math.cos(ease('easeIn', p) * Math.PI / 2); } },
    blur: { label: '模糊淡出', dur: 0.8, apply: (s, p) => { const q = ease('easeIn', p); s.blur += q * 24; s.alpha *= 1 - q; } },
    wipe: { label: '擦除收起', dur: 0.8, apply: (s, p) => { s.reveal = { dir: 'left', p: 1 - ease('easeInOut', p) }; } },
    iris: { label: '圓形收合', dur: 0.8, apply: (s, p) => { s.reveal = { dir: 'iris', p: 1 - ease('easeInOut', p) }; } },
    typewriter: { label: '倒退刪字', dur: 1, text: true, apply: (s, p) => { s.glyphs.push((g, i, n) => { if (glyphP(1 - p, i, n, 0.02) <= 0) g.alpha = 0; }); } },
    fall: { label: '逐字掉落', dur: 1.2, text: true, apply: (s, p) => {
      s.glyphs.push((g, i, n) => { const q = glyphP(p, i, n, 0.5); g.dy += ease('easeIn', q) * 80; g.rot += q * 30; g.alpha *= 1 - q; });
    } },
  };

  // Loop presets run for the whole clip; t = clip content time (seconds since start + offset, so split halves stay continuous)
  const LOOP = {
    none: { label: '無', apply() {} },
    float: { label: '漂浮', apply: (s, t, sp, am) => { s.dy += Math.sin(t * Math.PI * sp) * 12 * am; } },
    pulse: { label: '呼吸', apply: (s, t, sp, am) => { const k = 1 + Math.sin(t * Math.PI * 2 * sp) * 0.05 * am; s.sx *= k; s.sy *= k; } },
    sway: { label: '搖擺', apply: (s, t, sp, am) => { s.rot += Math.sin(t * Math.PI * sp) * 8 * am; } },
    spin: { label: '持續旋轉', apply: (s, t, sp, am) => { s.rot += t * 90 * sp * am; } },
    blink: { label: '閃爍', apply: (s, t, sp, am) => { s.alpha *= 1 - am * 0.5 * (1 - Math.cos(t * Math.PI * 2 * sp)) / 2 * 2; } },
    flicker: { label: '燭光', apply: (s, t, sp, am, seed) => { s.alpha *= 1 - am * 0.35 * noise(t * 6 * sp, 0, 0, seed); } },
    shake: { label: '抖動', apply: (s, t, sp, am, seed) => {
      s.dx += (noise(t * 12 * sp, 1, 0, seed) - 0.5) * 16 * am; s.dy += (noise(t * 12 * sp, 7, 0, seed) - 0.5) * 16 * am;
    } },
    heartbeat: { label: '心跳', apply: (s, t, sp, am) => {
      const ph = (t * sp) % 1;
      const k = 1 + (Math.exp(-Math.pow((ph - 0.1) * 18, 2)) * 0.08 + Math.exp(-Math.pow((ph - 0.3) * 18, 2)) * 0.05) * am;
      s.sx *= k; s.sy *= k;
    } },
    jelly: { label: '果凍', apply: (s, t, sp, am) => { const w = Math.sin(t * Math.PI * 2 * sp) * 0.06 * am; s.sx *= 1 + w; s.sy *= 1 - w; } },
    wave: { label: '逐字波浪', text: true, apply: (s, t, sp, am) => {
      s.glyphs.push((g, i) => { g.dy += Math.sin(t * Math.PI * 2 * sp - i * 0.6) * 8 * am; });
    } },
    glyphPulse: { label: '逐字閃亮', text: true, apply: (s, t, sp, am) => {
      s.glyphs.push((g, i, n) => { const ph = ((t * sp * 0.8 - i / Math.max(1, n)) % 1 + 1) % 1; g.s *= 1 + Math.exp(-ph * 12) * 0.25 * am; });
    } },
  };

  function animState(clip, t, env) {
    const s = { dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, alpha: 1, blur: 0, reveal: null, glyphs: [] };
    const a = clip.anim;
    if (!a) return s;
    const since = t - clip.start;
    const until = clip.start + clip.duration - t;
    if (a.in && a.in.type && a.in.type !== 'none' && IN[a.in.type]) {
      const d = Math.max(0.01, Math.min(a.in.dur ?? IN[a.in.type].dur ?? 0.6, clip.duration));
      if (since < d) IN[a.in.type].apply(s, clamp(since / d, 0, 1), env);
    }
    if (a.out && a.out.type && a.out.type !== 'none' && OUT[a.out.type]) {
      const d = Math.max(0.01, Math.min(a.out.dur ?? OUT[a.out.type].dur ?? 0.6, clip.duration));
      if (until < d) OUT[a.out.type].apply(s, clamp(1 - until / d, 0, 1), env);
    }
    if (a.loop && a.loop.type && a.loop.type !== 'none' && LOOP[a.loop.type]) {
      LOOP[a.loop.type].apply(s, since + (clip.offset || 0), a.loop.speed ?? 1, a.loop.amount ?? 1, hashSeed(clip.id));
    }
    return s;
  }

  const seedCache = new Map();
  function hashSeed(id) {
    let v = seedCache.get(id);
    if (v === undefined) {
      v = 0;
      for (const ch of String(id)) v = (Math.imul(v, 31) + ch.charCodeAt(0)) | 0;
      seedCache.set(id, (v = Math.abs(v) % 100000));
    }
    return v;
  }

  // Default glyph transform and composition of all active glyph effects
  function glyphTransform(s, i, n) {
    const g = { dx: 0, dy: 0, s: 1, rot: 0, alpha: 1 };
    for (const f of s.glyphs) f(g, i, n);
    return g;
  }

  P5M.presets = { IN, OUT, LOOP, glyphP, hash, hashSeed };
  P5M.animState = animState;
  P5M.glyphTransform = glyphTransform;
})();

<script>
// Asset loading: images, audio buffers, web fonts and legacy p5 projects (hidden srcdoc iframe).
// Loads are lazy; when something finishes, P5M.assets.onReady() fires so the host can re-render.
(function () {
  const P5M = window.P5M;

  const FONTS = [
    { family: 'Noto Sans TC', label: '思源黑體', google: 'Noto+Sans+TC:wght@400;700;900' },
    { family: 'Noto Serif TC', label: '思源宋體', google: 'Noto+Serif+TC:wght@400;700;900' },
    { family: 'LXGW WenKai TC', label: '霞鶩文楷', google: 'LXGW+WenKai+TC:wght@400;700' },
    { family: 'Microsoft JhengHei', label: '微軟正黑體（系統）' },
    { family: 'Poppins', label: 'Poppins', google: 'Poppins:wght@400;700;900' },
    { family: 'Playfair Display', label: 'Playfair Display', google: 'Playfair+Display:wght@400;700;900' },
    { family: 'Pacifico', label: 'Pacifico（手寫）', google: 'Pacifico' },
  ];

  const images = new Map();
  const audio = new Map();
  const legacy = new Map();
  const fontsRequested = new Set();
  const fontsLoaded = new Set();
  let decodeCtx = null;

  const api = {
    FONTS,
    onReady: () => {},
    notify() { api.onReady(); },

    image(asset) {
      if (!asset) return null;
      let e = images.get(asset.id);
      if (!e) {
        const img = new Image();
        e = { img, ready: false, error: null };
        images.set(asset.id, e);
        img.onload = () => { e.ready = true; api.notify(); };
        img.onerror = () => { e.error = '圖片載入失敗：' + asset.name; console.error(e.error); api.notify(); };
        img.src = asset.src;
      }
      return e.ready ? e.img : null;
    },

    audioBuffer(asset) {
      if (!asset) return Promise.resolve(null);
      let e = audio.get(asset.id);
      if (!e) {
        decodeCtx = decodeCtx || new OfflineAudioContext(2, 1, 48000);
        e = fetch(asset.src).then((r) => r.arrayBuffer()).then((b) => decodeCtx.decodeAudioData(b))
          .catch((err) => { console.error('音訊解碼失敗', asset.name, err); return null; });
        audio.set(asset.id, e);
      }
      return e;
    },

    // Google Fonts link for the given families (only those not requested yet)
    requestFonts(families) {
      const need = FONTS.filter((f) => f.google && families.includes(f.family) && !fontsRequested.has(f.family));
      if (!need.length) return;
      need.forEach((f) => fontsRequested.add(f.family));
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?' + need.map((f) => 'family=' + f.google).join('&') + '&display=swap';
      document.head.appendChild(link);
    },

    // Ensure glyphs of `text` in `family` are loaded; re-render once they arrive
    font(family, weight, text) {
      const key = family + '|' + weight + '|' + text;
      if (fontsLoaded.has(key)) return;
      fontsLoaded.add(key);
      api.requestFonts([family]);
      document.fonts.load(`${weight} 40px "${family}"`, text || 'A').then(() => api.notify()).catch(() => {});
    },

    legacy(asset) {
      if (!asset) return null;
      let e = legacy.get(asset.id);
      if (!e) { e = buildLegacy(asset); legacy.set(asset.id, e); }
      return e;
    },

    // Drop cached images, decoded audio and legacy iframes (each a full p5 page) whose asset is not in keepIds;
    // the editor calls this when another project opens
    release(keepIds) {
      for (const id of [...images.keys()]) if (!keepIds.has(id)) images.delete(id);
      for (const id of [...audio.keys()]) if (!keepIds.has(id)) audio.delete(id);
      for (const [id, e] of legacy) if (!keepIds.has(id)) { e.frame.remove(); legacy.delete(id); }
    },

    // Wait until everything the project references is loaded (used before export and first play)
    async prepare(project) {
      const jobs = [];
      const used = usedAssetIds(project);
      for (const id of used) {
        const a = project.assets[id];
        if (!a) continue;
        if (a.kind === 'image') { api.image(a); jobs.push(waitFor(() => images.get(a.id).ready || images.get(a.id).error)); }
        if (a.kind === 'audio') jobs.push(api.audioBuffer(a));
        if (a.kind === 'legacy') jobs.push(api.legacy(a).promise);
      }
      const fams = new Map();
      for (const tr of project.tracks) for (const c of tr.clips) {
        if (c.type === 'text') {
          const f = c.props.font || 'Noto Sans TC';
          fams.set(f + '|' + (c.props.weight || 700), (fams.get(f + '|' + (c.props.weight || 700)) || '') + (c.props.text || ''));
        }
      }
      api.requestFonts([...fams.keys()].map((k) => k.split('|')[0]));
      for (const [k, text] of fams) {
        const [f, w] = k.split('|');
        jobs.push(document.fonts.load(`${w} 40px "${f}"`, text).catch(() => {}));
      }
      await Promise.all(jobs);
    },

    usedAssetIds,
  };

  function usedAssetIds(project) {
    const ids = new Set();
    for (const tr of project.tracks) for (const c of tr.clips) for (const k of ['asset', 'texture']) if (c.props && c.props[k]) ids.add(c.props[k]);
    return ids;
  }

  function waitFor(cond, timeout = 15000) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const iv = setInterval(() => {
        if (cond() || performance.now() - t0 > timeout) { clearInterval(iv); resolve(); }
      }, 50);
    });
  }

  // Legacy project = p5 global-mode sketch following the p5-comfyui-animation engine.js contract.
  // It runs inside a same-origin srcdoc iframe; each frame we call seek(t) and copy its canvas.
  function buildLegacy(asset) {
    const e = { ready: false, error: null, frame: null, cw: null, canvas: null, film: null, score: null, promise: null };
    const safe = (s) => String(s || '').replace(/<\/script/gi, '<\\/script');
    const f = asset.files || {};
    const boot = 'window.__p5mReady=false;const __p5mSetup=setup;' +
      'setup=function(){__p5mSetup();noLoop();window.__p5mReady=true;};';
    const fontLink = asset.fontHref ? `<link rel="stylesheet" href="${asset.fontHref.replace(/"/g, '&quot;')}">` : '';
    const html = '<!doctype html><html><head><meta charset="utf-8">' + fontLink +
      '<style>html,body{margin:0;background:#000;overflow:hidden}</style>' +
      '<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"><\/script>' +
      ['assets', 'engine', 'sound', 'sketch'].map((k) => `<script>${safe(f[k])}<\/script>`).join('') +
      `<script>${boot}<\/script></head><body><div id="stage"></div></body></html>`;
    const fr = document.createElement('iframe');
    fr.setAttribute('aria-hidden', 'true');
    fr.tabIndex = -1;
    fr.style.cssText = `position:fixed;left:-30000px;top:0;width:${asset.width || 1280}px;height:${asset.height || 720}px;border:0;pointer-events:none`;
    fr.srcdoc = html;
    document.body.appendChild(fr);
    e.frame = fr;
    e.promise = new Promise((resolve) => {
      const t0 = performance.now();
      const iv = setInterval(async () => {
        if (!fr.isConnected) { clearInterval(iv); resolve(e); return; } // released before it finished loading
        let cw = null;
        try { cw = fr.contentWindow; } catch (err) { /* cross-origin (should not happen) */ }
        if (cw && cw.__p5mReady) {
          clearInterval(iv);
          try {
            e.cw = cw;
            e.canvas = cw.document.querySelector('canvas');
            e.film = cw.eval('typeof FILM !== "undefined" ? FILM : null');
            e.score = cw.eval('typeof SCORE !== "undefined" ? SCORE : null');
            if (e.film && e.film.fontSpec) await cw.document.fonts.load(e.film.fontSpec, e.film.fontText || '').catch(() => {});
            e.ready = true;
          } catch (err) {
            e.error = '舊專案初始化失敗：' + err.message;
            console.error(e.error, err);
          }
          api.notify();
          resolve(e);
        } else if (performance.now() - t0 > 30000) {
          clearInterval(iv);
          e.error = '舊專案載入逾時（30 秒）：' + asset.name;
          console.error(e.error);
          api.notify();
          resolve(e);
        }
      }, 60);
    });
    return e;
  }

  // Render the legacy project at local time lt; returns its canvas or null while loading
  api.legacyFrame = function (asset, lt) {
    const e = api.legacy(asset);
    if (!e.ready) return null;
    const dur = (e.film && e.film.duration) || asset.duration || 0;
    e.cw.seek(Math.max(0, Math.min(lt, dur)));
    return e.canvas;
  };

  P5M.assets = api;
})();

</script>
<script>
// Basic visual layer types: shape, text, image, code, legacy.
// draw(p, pr, env) paints around the local origin; the renderer already applied position, rotation, scale, opacity.
// bounds(pr, env) returns the local box { w, h } centered on the origin (hit testing, handles, wipe reveal).
(function () {
  const P5M = window.P5M;
  const { registerType, rgba, rad } = P5M;

  // ---------- shape ----------
  function shapePath(kind, w, h, pr) {
    const path = new Path2D();
    const hw = w / 2, hh = h / 2;
    if (kind === 'rect') {
      const r = Math.min(pr.radius || 0, hw, hh);
      if (path.roundRect) path.roundRect(-hw, -hh, w, h, r); else path.rect(-hw, -hh, w, h);
    } else if (kind === 'ellipse') {
      path.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
    } else if (kind === 'ring') {
      const k = Math.max(0.05, Math.min(0.95, pr.inner ?? 0.7));
      path.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
      path.ellipse(0, 0, hw * k, hh * k, 0, Math.PI * 2, 0, true);
    } else if (kind === 'arc') {
      const sweep = rad(Math.max(0, Math.min(360, pr.sweep ?? 270)));
      path.moveTo(0, 0);
      path.ellipse(0, 0, hw, hh, 0, -Math.PI / 2, -Math.PI / 2 + sweep);
      path.closePath();
    } else if (kind === 'triangle') {
      path.moveTo(0, -hh); path.lineTo(hw, hh); path.lineTo(-hw, hh); path.closePath();
    } else if (kind === 'star' || kind === 'polygon') {
      const n = Math.max(3, Math.round(kind === 'star' ? pr.points || 5 : pr.sides || 6));
      const steps = kind === 'star' ? n * 2 : n;
      const inner = kind === 'star' ? Math.max(0.1, Math.min(1, pr.inner ?? 0.45)) : 1;
      for (let i = 0; i < steps; i++) {
        const a = -Math.PI / 2 + (i * Math.PI * 2) / steps;
        const k = kind === 'star' && i % 2 ? inner : 1;
        const x = Math.cos(a) * hw * k, y = Math.sin(a) * hh * k;
        if (i) path.lineTo(x, y); else path.moveTo(x, y);
      }
      path.closePath();
    } else if (kind === 'heart') {
      path.moveTo(0, hh);
      path.bezierCurveTo(-hw * 1.35, -hh * 0.1, -hw * 0.55, -hh * 1.25, 0, -hh * 0.45);
      path.bezierCurveTo(hw * 0.55, -hh * 1.25, hw * 1.35, -hh * 0.1, 0, hh);
      path.closePath();
    } else if (kind === 'line') {
      path.moveTo(-hw, 0); path.lineTo(hw, 0);
    }
    return path;
  }

  function paintFill(ctx, pr, w, h) {
    if (pr.gradient === 'linear') {
      const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, rgba(pr.fill)); g.addColorStop(1, rgba(pr.fill2));
      return g;
    }
    if (pr.gradient === 'radial') {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(w, h) / 2);
      g.addColorStop(0, rgba(pr.fill)); g.addColorStop(1, rgba(pr.fill2));
      return g;
    }
    return rgba(pr.fill);
  }

  function applyGlow(ctx, pr) {
    if (pr.glow > 0) { ctx.shadowBlur = pr.glow; ctx.shadowColor = rgba(pr.glowColor || '#ffffff'); }
  }

  registerType('shape', {
    label: '形狀', category: 'shape',
    props: [
      { key: 'kind', label: '形狀', type: 'select', default: 'rect', group: 'main', options: [
        ['rect', '矩形'], ['ellipse', '圓形'], ['triangle', '三角形'], ['star', '星形'], ['polygon', '多邊形'],
        ['heart', '愛心'], ['ring', '圓環'], ['arc', '扇形'], ['line', '線條']] },
      { key: 'w', label: '寬', type: 'number', min: 1, step: 1, default: 240, group: 'main', anim: true },
      { key: 'h', label: '高', type: 'number', min: 1, step: 1, default: 240, group: 'main', anim: true },
      { key: 'fill', label: '填色', type: 'color', default: '#ffcc4d', group: 'main', anim: true },
      { key: 'gradient', label: '漸層', type: 'select', default: 'none', group: 'main', options: [['none', '無'], ['linear', '線性'], ['radial', '放射']] },
      { key: 'fill2', label: '漸層色', type: 'color', default: '#ff6b6b', group: 'main', anim: true, when: (pr) => pr.gradient !== 'none' },
      { key: 'stroke', label: '外框色', type: 'color', default: '#ffffff', group: 'main', anim: true },
      { key: 'strokeWeight', label: '外框粗細', type: 'number', min: 0, step: 0.5, default: 0, group: 'main', anim: true },
      { key: 'radius', label: '圓角', type: 'number', min: 0, step: 1, default: 24, group: 'main', anim: true, when: (pr) => pr.kind === 'rect' },
      { key: 'points', label: '角數', type: 'number', min: 3, max: 24, step: 1, default: 5, group: 'main', when: (pr) => pr.kind === 'star' },
      { key: 'sides', label: '邊數', type: 'number', min: 3, max: 24, step: 1, default: 6, group: 'main', when: (pr) => pr.kind === 'polygon' },
      { key: 'inner', label: '內徑比例', type: 'range', min: 0.05, max: 0.95, step: 0.01, default: 0.45, group: 'main', anim: true, when: (pr) => pr.kind === 'star' || pr.kind === 'ring' },
      { key: 'sweep', label: '角度', type: 'range', min: 0, max: 360, step: 1, default: 270, unit: '°', group: 'main', anim: true, when: (pr) => pr.kind === 'arc' },
      { key: 'glow', label: '光暈', type: 'number', min: 0, step: 1, default: 0, group: 'main', anim: true },
      { key: 'glowColor', label: '光暈色', type: 'color', default: '#ffffff', group: 'main', anim: true, when: (pr) => pr.glow > 0 },
    ],
    draw(p, pr) {
      const ctx = p.drawingContext;
      const path = shapePath(pr.kind, pr.w, pr.h, pr);
      applyGlow(ctx, pr);
      if (pr.kind === 'line') {
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.max(1, pr.strokeWeight || 6);
        ctx.strokeStyle = rgba(pr.strokeWeight > 0 ? pr.stroke : pr.fill);
        ctx.stroke(path);
        return;
      }
      ctx.fillStyle = paintFill(ctx, pr, pr.w, pr.h);
      ctx.fill(path, 'evenodd');
      if (pr.strokeWeight > 0) {
        ctx.shadowBlur = 0;
        ctx.lineJoin = 'round';
        ctx.lineWidth = pr.strokeWeight;
        ctx.strokeStyle = rgba(pr.stroke);
        ctx.stroke(path);
      }
    },
    bounds: (pr) => ({ w: pr.w, h: pr.kind === 'line' ? Math.max(pr.strokeWeight || 6, 12) : pr.h }),
  });

  // ---------- text ----------
  const measureCtx = document.createElement('canvas').getContext('2d');
  const widthCache = new Map();
  // Widths measured before a web font arrives are fallback-font widths; drop them and repaint once it loads
  document.fonts.addEventListener('loadingdone', () => { widthCache.clear(); P5M.assets.notify(); });
  const fontString = (pr) => `${pr.weight || 700} ${pr.size}px "${pr.font}", "Noto Sans TC", "Microsoft JhengHei", sans-serif`;

  function layoutText(pr) {
    const font = fontString(pr);
    measureCtx.font = font;
    const lines = String(pr.text ?? '').split('\n').map((line) => [...line]);
    const spacing = pr.letterSpacing || 0;
    const lh = pr.size * (pr.lineHeight || 1.25);
    const measured = lines.map((chars) => chars.map((ch) => {
      const key = font + '|' + ch;
      let w = widthCache.get(key);
      if (w === undefined) { w = measureCtx.measureText(ch).width; widthCache.set(key, w); }
      return w;
    }));
    const lineW = measured.map((ws) => ws.reduce((a, b) => a + b, 0) + Math.max(0, ws.length - 1) * spacing);
    const maxW = Math.max(1, ...lineW);
    const glyphs = [];
    lines.forEach((chars, li) => {
      let x = pr.align === 'left' ? -maxW / 2 : pr.align === 'right' ? maxW / 2 - lineW[li] : -lineW[li] / 2;
      const y = -((lines.length - 1) * lh) / 2 + li * lh;
      chars.forEach((ch, ci) => {
        const w = measured[li][ci];
        glyphs.push({ ch, x: x + w / 2, y });
        x += w + spacing;
      });
    });
    return { font, glyphs, w: maxW, h: lines.length * lh };
  }

  registerType('text', {
    label: '文字', category: 'text',
    props: [
      { key: 'text', label: '內容', type: 'textarea', default: '輸入文字', group: 'main' },
      { key: 'font', label: '字型', type: 'font', default: 'Noto Sans TC', group: 'main' },
      { key: 'weight', label: '粗細', type: 'select', default: 700, group: 'main', options: [[400, '一般'], [700, '粗'], [900, '特粗']] },
      { key: 'size', label: '字級', type: 'number', min: 4, step: 1, default: 72, group: 'main', anim: true },
      { key: 'fill', label: '文字色', type: 'color', default: '#ffffff', group: 'main', anim: true },
      { key: 'stroke', label: '描邊色', type: 'color', default: '#000000', group: 'main', anim: true },
      { key: 'strokeWeight', label: '描邊粗細', type: 'number', min: 0, step: 0.5, default: 0, group: 'main', anim: true },
      { key: 'align', label: '對齊', type: 'select', default: 'center', group: 'main', options: [['left', '靠左'], ['center', '置中'], ['right', '靠右']] },
      { key: 'letterSpacing', label: '字距', type: 'number', step: 1, default: 0, group: 'main', anim: true },
      { key: 'lineHeight', label: '行高', type: 'number', min: 0.5, step: 0.05, default: 1.3, group: 'main' },
      { key: 'glow', label: '光暈', type: 'number', min: 0, step: 1, default: 0, group: 'main', anim: true },
      { key: 'glowColor', label: '光暈色', type: 'color', default: '#ffd27a', group: 'main', anim: true, when: (pr) => pr.glow > 0 },
    ],
    draw(p, pr, env) {
      const ctx = p.drawingContext;
      P5M.assets.font(pr.font, pr.weight || 700, pr.text);
      const L = layoutText(pr);
      ctx.font = L.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      applyGlow(ctx, pr);
      const fill = rgba(pr.fill), stroke = rgba(pr.stroke);
      const n = L.glyphs.length;
      const base = ctx.globalAlpha;
      L.glyphs.forEach((gl, i) => {
        const g = env.st.glyphs.length ? P5M.glyphTransform(env.st, i, n) : null;
        if (g && (g.alpha <= 0.001 || g.s === 0)) return;
        ctx.save();
        ctx.translate(gl.x + (g ? g.dx : 0), gl.y + (g ? g.dy : 0));
        if (g) { if (g.rot) ctx.rotate(rad(g.rot)); if (g.s !== 1) ctx.scale(g.s, g.s); ctx.globalAlpha = base * Math.min(1, g.alpha); }
        if (pr.strokeWeight > 0) { ctx.lineWidth = pr.strokeWeight * 2; ctx.strokeStyle = stroke; ctx.strokeText(gl.ch, 0, 0); }
        ctx.fillStyle = fill;
        ctx.fillText(gl.ch, 0, 0);
        ctx.restore();
      });
    },
    bounds(pr) { const L = layoutText(pr); return { w: L.w, h: L.h }; },
  });

  // ---------- image ----------
  registerType('image', {
    label: '圖片', category: 'media',
    props: [
      { key: 'asset', label: '圖片', type: 'asset', accept: 'image', group: 'main' },
      { key: 'w', label: '寬', type: 'number', min: 1, step: 1, default: 400, group: 'main', anim: true },
      { key: 'flipX', label: '水平翻轉', type: 'bool', default: false, group: 'main' },
      { key: 'radius', label: '圓角', type: 'number', min: 0, step: 1, default: 0, group: 'main', anim: true },
      { key: 'glow', label: '陰影／光暈', type: 'number', min: 0, step: 1, default: 0, group: 'main', anim: true },
      { key: 'glowColor', label: '光暈色', type: 'color', default: '#000000aa', group: 'main', anim: true, when: (pr) => pr.glow > 0 },
    ],
    draw(p, pr, env) {
      const asset = env.project.assets[pr.asset];
      const img = P5M.assets.image(asset);
      const b = this.bounds(pr, env);
      const ctx = p.drawingContext;
      if (!img) {
        ctx.fillStyle = 'rgba(128,128,128,0.35)';
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        return;
      }
      if (pr.flipX) ctx.scale(-1, 1);
      applyGlow(ctx, pr);
      if (pr.radius > 0) {
        const path = new Path2D();
        if (path.roundRect) path.roundRect(-b.w / 2, -b.h / 2, b.w, b.h, pr.radius); else path.rect(-b.w / 2, -b.h / 2, b.w, b.h);
        if (pr.glow > 0) { ctx.fillStyle = '#000'; ctx.fill(path); ctx.shadowBlur = 0; }
        ctx.clip(path);
      }
      ctx.drawImage(img, -b.w / 2, -b.h / 2, b.w, b.h);
    },
    bounds(pr, env) {
      const a = env && env.project.assets[pr.asset];
      const img = a && !a.w ? P5M.assets.image(a) : null; // hand-written assets may lack w / h
      const ratio = a && a.w ? a.h / a.w : img ? img.naturalHeight / img.naturalWidth : 0.75;
      return { w: pr.w, h: pr.w * ratio };
    },
  });

  // ---------- code (escape hatch: raw p5 drawing) ----------
  const DEFAULT_CODE = [
    '// p = p5 instance, t = seconds since this clip started, env.W / env.H = canvas size',
    '// Draw around (0, 0). Position, scale and in/out animations come from the clip.',
    'p.noFill();',
    'p.strokeWeight(4);',
    'for (let i = 0; i < 10; i++) {',
    '  p.stroke(255, 180 + i * 7, 80, 220 - i * 18);',
    '  const r = 40 + i * 16 + Math.sin(t * 2 + i * 0.6) * 10;',
    '  p.circle(0, 0, r * 2);',
    '}',
  ].join('\n');
  const compiled = new Map();
  function compile(code) {
    let e = compiled.get(code);
    if (!e) {
      try { e = { fn: new Function('p', 't', 'env', 'P5M', code), error: null }; } catch (err) { e = { fn: null, error: err.message }; }
      compiled.set(code, e);
    }
    return e;
  }
  function drawError(ctx, w, h, msg) {
    ctx.fillStyle = 'rgba(180,30,40,0.55)';
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('程式碼錯誤：' + String(msg).slice(0, 60), 0, 0);
  }

  registerType('code', {
    label: '程式碼', category: 'code',
    props: [
      { key: 'code', label: 'p5 程式碼', type: 'code', default: DEFAULT_CODE, group: 'main' },
      { key: 'w', label: '範圍寬', type: 'number', min: 1, step: 1, default: 400, group: 'main' },
      { key: 'h', label: '範圍高', type: 'number', min: 1, step: 1, default: 400, group: 'main' },
    ],
    draw(p, pr, env) {
      const c = compile(pr.code || '');
      if (c.error) { drawError(p.drawingContext, pr.w, pr.h, c.error); return; }
      p.push();
      try { c.fn(p, env.lt, env, P5M); } catch (err) {
        if (!c.warned) { console.error('程式碼 clip 執行錯誤', err); c.warned = true; }
        p.pop(); p.push();
        drawError(p.drawingContext, pr.w, pr.h, err.message);
      }
      p.pop();
    },
    bounds: (pr) => ({ w: pr.w, h: pr.h }),
  });

  // ---------- legacy p5-comfyui-animation project (whole clip) ----------
  registerType('legacy', {
    label: '舊版動畫', category: 'media',
    props: [{ key: 'asset', label: '來源', type: 'asset', accept: 'legacy', group: 'main' }],
    draw(p, pr, env) {
      const asset = env.project.assets[pr.asset];
      const b = this.bounds(pr, env);
      const ctx = p.drawingContext;
      const cv = asset ? P5M.assets.legacyFrame(asset, env.lt) : null;
      if (cv) { ctx.drawImage(cv, -b.w / 2, -b.h / 2, b.w, b.h); return; }
      const e = asset && P5M.assets.legacy(asset);
      ctx.fillStyle = '#1d1a2b';
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.fillStyle = e && e.error ? '#ff8a8a' : '#b9b3d6';
      ctx.font = '28px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e && e.error ? e.error : '舊版動畫載入中…', 0, 0);
    },
    bounds(pr, env) {
      const a = env && env.project.assets[pr.asset];
      return { w: (a && a.width) || 1280, h: (a && a.height) || 720 };
    },
  });

  P5M.shapePath = shapePath;
  P5M.layoutText = layoutText;
})();

<script>
// Particle and weather layers. Stateless: every particle position is a pure function of (index, seed, time),
// so scrubbing, seeking and export all give identical frames without simulation state.
(function () {
  const P5M = window.P5M;
  const { registerType, hash, noise, rgba, parseColor, mixColor } = P5M;
  const TAU = Math.PI * 2;

  // Cached soft round sprite per color (radial gradient), drawn with drawImage for speed
  const spriteCache = new Map();
  function softDot(color) {
    let c = spriteCache.get(color);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    // CPU-backed on purpose: GPU-backed sprites were measured at ~7 ms per drawImage once Chrome's canvas
    // state degraded (300-particle fireworks frame took 1.7 s); CPU sprites stayed ~0.002 ms per draw
    const g = c.getContext('2d', { willReadFrequently: true });
    const [r, gg, b] = parseColor(color);
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, `rgba(${r},${gg},${b},1)`);
    grad.addColorStop(0.35, `rgba(${r},${gg},${b},0.55)`);
    grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    spriteCache.set(color, c);
    return c;
  }
  function sprite(ctx, color, x, y, d, alpha) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(softDot(color), x - d / 2, y - d / 2, d, d);
  }
  function petal(ctx, x, y, s, rot, flip) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, flip);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.7, s * 0.6, 0, s);
    ctx.bezierCurveTo(-s * 0.7, s * 0.6, -s * 0.9, -s * 0.6, 0, -s);
    ctx.fill();
    ctx.restore();
  }
  function heart(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.4, y, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y, x, y + s * 0.9);
    ctx.fill();
  }

  // motion: fall / rise (wrap vertically), drift (wrap horizontally), wander (noise), static, burst (fireworks)
  const PRESETS = {
    snow: { label: '雪花', motion: 'fall', vy: 60, sway: 18, d: { count: 180, size: 7, speed: 1, wind: 0.3, color: '#ffffff', color2: '#d6e9ff' },
      draw: (ctx, q, pr) => sprite(ctx, q.color, q.x, q.y, q.s * 2.2, q.a * 0.95) },
    rain: { label: '雨', motion: 'fall', vy: 900, sway: 0, d: { count: 220, size: 2, speed: 1, wind: 0.15, color: '#b8d4ff', color2: '#7fa8e0' },
      draw: (ctx, q, pr) => {
        const len = q.s * 9;
        ctx.globalAlpha = q.a * 0.6; ctx.strokeStyle = q.color; ctx.lineWidth = Math.max(1, q.s * 0.6);
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - pr.wind * len * 0.8, q.y - len); ctx.stroke();
      } },
    sakura: { label: '櫻花', motion: 'fall', vy: 55, sway: 50, d: { count: 70, size: 10, speed: 1, wind: 0.6, color: '#ffc4d6', color2: '#ff9ab8' },
      draw: (ctx, q) => { ctx.globalAlpha = q.a; ctx.fillStyle = q.color; petal(ctx, q.x, q.y, q.s, q.spin, Math.cos(q.spin * 1.7)); } },
    leaves: { label: '落葉', motion: 'fall', vy: 70, sway: 60, d: { count: 45, size: 14, speed: 1, wind: 0.5, color: '#e8923a', color2: '#c0392b' },
      draw: (ctx, q) => {
        ctx.globalAlpha = q.a; ctx.fillStyle = q.color; petal(ctx, q.x, q.y, q.s, q.spin, Math.cos(q.spin * 1.3) * 0.6);
        ctx.strokeStyle = 'rgba(80,40,10,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(q.x - Math.sin(q.spin) * q.s, q.y + Math.cos(q.spin) * q.s * 0.2); ctx.lineTo(q.x + Math.sin(q.spin) * q.s, q.y); ctx.stroke();
      } },
    confetti: { label: '彩色紙花', motion: 'fall', vy: 160, sway: 30, palette: true, d: { count: 160, size: 9, speed: 1, wind: 0.2, color: '#ffd166', color2: '#ef476f' },
      draw: (ctx, q) => {
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.spin); ctx.scale(1, Math.cos(q.spin * 2.3));
        ctx.globalAlpha = q.a; ctx.fillStyle = q.color; ctx.fillRect(-q.s / 2, -q.s * 0.3, q.s, q.s * 0.6); ctx.restore();
      } },
    bubbles: { label: '泡泡', motion: 'rise', vy: 70, sway: 25, d: { count: 40, size: 22, speed: 1, wind: 0, color: '#bfefff', color2: '#ffffff' },
      draw: (ctx, q) => {
        ctx.globalAlpha = q.a * 0.8; ctx.strokeStyle = q.color; ctx.lineWidth = Math.max(1, q.s * 0.08);
        ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, TAU); ctx.stroke();
        ctx.globalAlpha = q.a * 0.6; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(q.x - q.s * 0.35, q.y - q.s * 0.35, q.s * 0.18, 0, TAU); ctx.fill();
      } },
    embers: { label: '火星', motion: 'rise', vy: 90, sway: 30, life: true, d: { count: 90, size: 5, speed: 1, wind: 0.1, color: '#ffb347', color2: '#ff4e1a' },
      draw: (ctx, q) => sprite(ctx, q.color, q.x, q.y, q.s * 3, q.a) },
    lanterns: { label: '天燈', motion: 'rise', vy: 28, sway: 14, d: { count: 24, size: 26, speed: 1, wind: 0.1, color: '#ffb84d', color2: '#ff7a2f' },
      draw: (ctx, q) => {
        sprite(ctx, q.color, q.x, q.y, q.s * 4, q.a * 0.45);
        ctx.globalAlpha = q.a;
        const w = q.s, h = q.s * 1.25;
        const g = ctx.createLinearGradient(0, q.y - h / 2, 0, q.y + h / 2);
        g.addColorStop(0, rgba(q.color2)); g.addColorStop(1, rgba(mixColor(q.color, '#fff6c8', 0.5)));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(q.x - w * 0.42, q.y - h / 2); ctx.lineTo(q.x + w * 0.42, q.y - h / 2);
        ctx.lineTo(q.x + w * 0.32, q.y + h / 2); ctx.lineTo(q.x - w * 0.32, q.y + h / 2); ctx.closePath(); ctx.fill();
      } },
    hearts: { label: '愛心飄升', motion: 'rise', vy: 60, sway: 30, d: { count: 36, size: 14, speed: 1, wind: 0, color: '#ff6b8b', color2: '#ffb3c6' },
      draw: (ctx, q) => { ctx.globalAlpha = q.a; ctx.fillStyle = q.color; heart(ctx, q.x, q.y, q.s); } },
    fireflies: { label: '螢火蟲', motion: 'wander', d: { count: 50, size: 6, speed: 1, wind: 0, color: '#d9ff7a', color2: '#fff3a0' },
      draw: (ctx, q) => { const b = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(q.t * 2.2 * q.r5 + q.r6 * TAU), 2); sprite(ctx, q.color, q.x, q.y, q.s * 4, q.a * b); } },
    dust: { label: '光塵', motion: 'wander', d: { count: 120, size: 3, speed: 0.5, wind: 0, color: '#fff2cc', color2: '#ffffff' },
      draw: (ctx, q) => sprite(ctx, q.color, q.x, q.y, q.s * 3, q.a * (0.3 + 0.5 * q.r5)) },
    stars: { label: '星星閃爍', motion: 'static', d: { count: 160, size: 3, speed: 1, wind: 0, color: '#ffffff', color2: '#ffe9a8' },
      draw: (ctx, q) => {
        const tw = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(q.t * (1 + q.r5 * 3) + q.r6 * TAU));
        sprite(ctx, q.color, q.x, q.y, q.s * 3, q.a * tw);
        if (q.r7 > 0.93) {
          ctx.globalAlpha = q.a * tw * 0.7; ctx.strokeStyle = q.color; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(q.x - q.s * 4, q.y); ctx.lineTo(q.x + q.s * 4, q.y); ctx.moveTo(q.x, q.y - q.s * 4); ctx.lineTo(q.x, q.y + q.s * 4); ctx.stroke();
        }
      } },
    fog: { label: '霧氣', motion: 'drift', vx: 18, d: { count: 26, size: 220, speed: 1, wind: 1, color: '#ffffff', color2: '#dde6f0' },
      draw: (ctx, q) => sprite(ctx, q.color, q.x, q.y, q.s * 2, q.a * 0.14) },
    fireworks: { label: '煙火', motion: 'burst', d: { count: 240, size: 4, speed: 1, wind: 0, color: '#ffd166', color2: '#ff5d8f' } },
  };

  // Burst fireworks: `bursts` shells each own count/bursts sparks; each shell re-launches every `period` seconds
  function drawFireworks(ctx, pr, t, W, H, A) {
    const seed = pr.seed | 0;
    const bursts = Math.max(1, Math.round(pr.count / 60));
    const per = Math.max(8, Math.floor(pr.count / bursts));
    const period = 2.6 / Math.max(0.05, pr.speed);
    for (let b = 0; b < bursts; b++) {
      const phase = hash(b * 13 + 1, seed) * period;
      const cycle = Math.floor((t + phase) / period);
      const age = (t + phase) / period - cycle; // 0..1 inside one launch
      const k = b * 1000 + cycle;
      const cx = (hash(k, seed + 3) - 0.5) * W * 0.8;
      const cy = (hash(k, seed + 5) - 0.5) * H * 0.5 - H * 0.12;
      const color = hash(k, seed + 7) < 0.5 ? pr.color : pr.color2;
      const launch = 0.22;
      if (age < launch) { // rising shell
        const q = age / launch;
        const y = H / 2 - (H / 2 - cy) * (1 - Math.pow(1 - q, 2));
        sprite(ctx, color, cx, y, pr.size * 3, 0.9 * A);
        continue;
      }
      const e = (age - launch) / (1 - launch);
      const radius = Math.min(W, H) * 0.22 * (0.7 + hash(k, seed + 11) * 0.6);
      const fadeA = Math.pow(1 - e, 1.6) * A;
      for (let j = 0; j < per; j++) {
        const ang = (j / per) * TAU + hash(j, k) * 0.3;
        const sp = 0.65 + hash(j + 99, k) * 0.35;
        const dist = radius * sp * (1 - Math.pow(1 - e, 3));
        const x = cx + Math.cos(ang) * dist;
        const y = cy + Math.sin(ang) * dist + e * e * radius * 0.5;
        const tail = radius * sp * 0.12 * (1 - e);
        ctx.globalAlpha = fadeA * 0.6; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, pr.size * 0.4);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(ang) * tail, y - Math.sin(ang) * tail); ctx.stroke();
        sprite(ctx, color, x, y, pr.size * 2.5, fadeA);
      }
    }
  }

  function palette(pr) { return [pr.color, pr.color2, '#ffd166', '#06d6a0', '#4cc9f0', '#f72585']; }

  function draw(p, pr, env) {
    const ctx = p.drawingContext;
    const preset = PRESETS[pr.preset] || PRESETS.snow;
    const W = pr.w, H = pr.h, t = env.lt;
    const seed = pr.seed | 0;
    const baseAlpha = ctx.globalAlpha;
    if (preset.motion === 'burst') { ctx.globalCompositeOperation = 'lighter'; drawFireworks(ctx, pr, t, W, H, baseAlpha); ctx.globalAlpha = baseAlpha; return; }
    const n = Math.max(0, Math.min(2000, Math.round(pr.count)));
    const sp = pr.speed;
    const m = pr.size * 4 + 20; // wrap margin so particles leave fully before reappearing
    const pal = preset.palette ? palette(pr) : null;
    for (let i = 0; i < n; i++) {
      const r = (k) => hash(i * 16 + k, seed);
      const q = { t, r5: r(5), r6: r(6), r7: r(7), a: baseAlpha, s: pr.size * (0.5 + r(2)) };
      q.color = pal ? pal[Math.floor(r(4) * pal.length)] : r(4) < 0.5 ? pr.color : pr.color2;
      const depth = 0.55 + r(3) * 0.9; // parallax: bigger particles move faster
      if (preset.motion === 'fall' || preset.motion === 'rise') {
        const span = H + 2 * m, spanX = W + 2 * m;
        const travel = preset.vy * sp * depth * t;
        let y = (((r(1) * span + travel) % span) + span) % span;
        if (preset.motion === 'rise') y = span - y;
        const sway = Math.sin(t * sp * (0.6 + r(8)) + r(9) * TAU) * (preset.sway || 0) * depth;
        const x = ((((r(0) * spanX + pr.wind * 80 * sp * depth * t + sway) % spanX) + spanX) % spanX);
        q.x = x - m - W / 2; q.y = y - m - H / 2;
        q.spin = r(10) * TAU + t * sp * (r(11) - 0.5) * 4;
        if (preset.life) q.a *= Math.sin(Math.PI * Math.min(1, y / span));
      } else if (preset.motion === 'drift') {
        const spanX = W + 2 * m;
        const x = (((r(0) * spanX + preset.vx * pr.wind * sp * depth * t) % spanX) + spanX) % spanX;
        q.x = x - m - W / 2;
        q.y = (r(1) - 0.5) * H + Math.sin(t * 0.3 * sp + r(9) * TAU) * 20;
      } else if (preset.motion === 'wander') {
        const f = 0.12 * sp;
        q.x = (r(0) - 0.5) * W + (noise(t * f + r(8) * 50, i * 0.37, 0, seed) - 0.5) * W * 0.35;
        q.y = (r(1) - 0.5) * H + (noise(t * f + r(9) * 50, i * 0.37, 7, seed) - 0.5) * H * 0.35;
      } else {
        q.x = (r(0) - 0.5) * W; q.y = (r(1) - 0.5) * H;
      }
      preset.draw(ctx, q, pr);
    }
    ctx.globalAlpha = baseAlpha;
  }

  registerType('particles', {
    label: '粒子', category: 'particles',
    props: [
      { key: 'preset', label: '效果', type: 'select', default: 'snow', group: 'main', options: Object.entries(PRESETS).map(([k, v]) => [k, v.label]) },
      { key: 'count', label: '數量', type: 'number', min: 0, max: 2000, step: 1, default: 180, group: 'main', anim: true },
      { key: 'size', label: '大小', type: 'number', min: 0.5, step: 0.5, default: 7, group: 'main', anim: true },
      { key: 'speed', label: '速度', type: 'range', min: 0, max: 4, step: 0.05, default: 1, group: 'main', anim: true },
      { key: 'wind', label: '風向', type: 'range', min: -3, max: 3, step: 0.05, default: 0.3, group: 'main', anim: true },
      { key: 'color', label: '顏色 1', type: 'color', default: '#ffffff', group: 'main', anim: true },
      { key: 'color2', label: '顏色 2', type: 'color', default: '#d6e9ff', group: 'main', anim: true },
      { key: 'w', label: '範圍寬', type: 'number', min: 1, step: 1, default: (s) => s.width, group: 'main' },
      { key: 'h', label: '範圍高', type: 'number', min: 1, step: 1, default: (s) => s.height, group: 'main' },
      { key: 'seed', label: '隨機種子', type: 'number', step: 1, default: 1, group: 'main' },
    ],
    draw,
    bounds: (pr) => ({ w: pr.w, h: pr.h }),
  });

  P5M.particlePresets = PRESETS;
})();

</script>
<script>
// Generative art layers. Each preset is a pure function of time; `uses` lists which generic params it reads
// so the inspector can hide the rest.
(function () {
  const P5M = window.P5M;
  const { registerType, hash, noise, rgba, mixColor } = P5M;
  const TAU = Math.PI * 2;

  const PRESETS = {
    gradientSky: {

// 3D primitives drawn into one shared WEBGL buffer per p5 instance, then composited onto the 2D canvas.
// The clip's 2D scale is folded into the 3D size so the result stays sharp instead of being bitmap-scaled.
(function () {
  const P5M = window.P5M;
  const { registerType, parseColor } = P5M;

  function buffer(p, W, H) {
    let g = p._p5m3d;
    if (!g || g.width !== W || g.height !== H) {
      if (g) g.remove();
      g = p._p5m3d = p.createGraphics(W, H, p.WEBGL);
      g.pixelDensity(1);
      g.setAttributes && g.setAttributes('alpha', true);
    }
    return g;
  }

  // p5 texture() needs a p5 object; wrap each image asset once in a 2D p5.Graphics
  const texCache = new WeakMap();
  function texture(p, img) {
    let per = texCache.get(p);
    if (!per) { per = new Map(); texCache.set(p, per); }
    let t = per.get(img);
    if (!t) {
      t = p.createGraphics(img.naturalWidth || img.width, img.naturalHeight || img.height);
      t.pixelDensity(1);
      t.drawingContext.drawImage(img, 0, 0);
      per.set(img, t);
    }
    return t;
  }

  function shape(g, kind, s, detail) {
    switch (kind) {
      case 'sphere': g.sphere(s / 2, detail, detail); break;
      case 'ellipsoid': g.ellipsoid(s / 2, s / 3, s / 2.6, detail, detail); break;
      case 'torus': g.torus(s / 2.8, s / 8, detail * 2, detail); break;
      case 'cone': g.cone(s / 2.4, s, detail, 1); break;
      case 'cylinder': g.cylinder(s / 2.4, s, detail, 1); break;
      case 'plane': g.plane(s, s); break;
      default: g.box(s);
    }
  }

  function draw(p, pr, env) {
    const W = env.W, H = env.H;
    const g = buffer(p, W, H);
    const kx = Math.abs(env.sx) || 1, ky = Math.abs(env.sy) || 1;
    const k = Math.max(kx, ky);
    const lt = env.lt;
    const [r, gg, b] = parseColor(pr.color);

    ctx.drawImage(g.elt, -W / 2, -H / 2, W, H);
  }

  registerType('shape3d', {
    label: '3D 物件', category: '3d',
    props: [
      { key: 'kind', label: '形狀', type: 'select', default: 'box', group: 'main', options: [
        ['box', '立方體'], ['sphere', '球體'], ['torus', '甜甜圈'], ['cone', '圓錐'], ['cylinder', '圓柱'], ['ellipsoid', '橢球'], ['plane', '平面卡片']] },
      { key: 'size', label: '尺寸', type: 'number', min: 1, step: 1, default: 220, group: 'main', anim: true },
      { key: 'color', label: '顏色', type: 'color', default: '#ff8a5c', group: 'main', anim: true },
      { key: 'material', label: '材質', type: 'select', default: 'lit', group: 'main', options: [

      { key: 'ambient', label: '環境光', type: 'range', min: 0, max: 1, step: 0.01, default: 0.35, group: 'main', anim: true },
      { key: 'spinX', label: 'X 自轉（°/秒）', type: 'number', step: 1, default: 20, group: 'main', anim: true },

      { key: 'tiltX', label: 'X 傾斜', type: 'number', step: 1, default: -20, unit: '°', group: 'main', anim: true },

      { key: 'tiltZ', label: 'Z 傾斜', type: 'number', step: 1, default: 0, unit: '°', group: 'main', anim: true },

// Screen-space layers: adjustment effects apply to everything already drawn below them (lower tracks),

(function () {

  let tmp = null;
