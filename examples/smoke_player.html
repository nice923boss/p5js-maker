        const v = 128 + (hash(j, i * 31 + 5) - 0.5) * 255;
        img.data[j * 4] = img.data[j * 4 + 1] = img.data[j * 4 + 2] = v;
        img.data[j * 4 + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      grainTiles[i] = c;
    }
    return grainTiles[i];
  }

  const BLENDS = [['multiply', '色彩增值'], ['screen', '濾色'], ['overlay', '覆蓋'], ['soft-light', '柔光'], ['color', '顏色'], ['source-over', '一般']];
  const amountProp = (def = 0.5, max = 1) => ({ key: 'amount', label: '強度', type: 'range', min: 0, max, step: 0.01, default: def, group: 'main', anim: true });

  const EFFECTS = {
    vignette: {
      label: '暗角', props: [amountProp(0.55), { key: 'color', label: '顏色', type: 'color', default: '#000000', group: 'main', anim: true },
        { key: 'size', label: '範圍', type: 'range', min: 0, max: 1, step: 0.01, default: 0.45, group: 'main', anim: true }],
      draw(ctx, pr, W, H, k) {
        const R = Math.hypot(W, H) / 2;
        const g = ctx.createRadialGradient(W / 2, H / 2, R * pr.size * 0.9, W / 2, H / 2, R);
        g.addColorStop(0, rgba(pr.color, 0)); g.addColorStop(1, rgba(pr.color, clamp(pr.amount * k, 0, 1)));
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      },
    },
    grain: {
      label: '底片顆粒', props: [amountProp(0.3)],
      draw(ctx, pr, W, H, k, lt) {
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = clamp(pr.amount * k, 0, 1);
        ctx.fillStyle = ctx.createPattern(grainTile(Math.floor(lt * 12) % 4), 'repeat');
        ctx.fillRect(0, 0, W, H);
      },
    },
    grade: {
      label: '調色', props: [
        { key: 'brightness', label: '亮度', type: 'range', min: 0, max: 2, step: 0.01, default: 1, group: 'main', anim: true },
        { key: 'contrast', label: '對比', type: 'range', min: 0, max: 2, step: 0.01, default: 1.1, group: 'main', anim: true },
        { key: 'saturate', label: '飽和度', type: 'range', min: 0, max: 3, step: 0.01, default: 1.2, group: 'main', anim: true },
        { key: 'hue', label: '色相', type: 'range', min: -180, max: 180, step: 1, default: 0, unit: '°', group: 'main', anim: true },
        { key: 'sepia', label: '懷舊', type: 'range', min: 0, max: 1, step: 0.01, default: 0, group: 'main', anim: true },
        { key: 'grayscale', label: '黑白', type: 'range', min: 0, max: 1, step: 0.01, default: 0, group: 'main', anim: true }],
      draw(ctx, pr, W, H, k) {
        refilter(ctx, W, H, `brightness(${pr.brightness}) contrast(${pr.contrast}) saturate(${pr.saturate}) hue-rotate(${pr.hue}deg) sepia(${pr.sepia}) grayscale(${pr.grayscale})`, k);
      },
    },
    blur: {
      label: '畫面模糊', props: [{ key: 'amount', label: '模糊程度', type: 'range', min: 0, max: 40, step: 0.5, default: 8, group: 'main', anim: true }],
      draw(ctx, pr, W, H, k) { refilter(ctx, W, H, `blur(${pr.amount * k}px)`, 1); },
    },
    glow: {
      label: '柔焦光暈', props: [amountProp(0.5), { key: 'radius', label: '光暈大小', type: 'range', min: 1, max: 60, step: 1, default: 18, group: 'main', anim: true }],
      draw(ctx, pr, W, H, k) {
        const src = snapshot(ctx, W, H);
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = clamp(pr.amount * k, 0, 1);
        ctx.filter = `blur(${pr.radius}px)`;
        ctx.drawImage(src, 0, 0);
      },
    },
    tint: {
      label: '色彩濾鏡', props: [amountProp(0.35), { key: 'color', label: '顏色', type: 'color', default: '#ff9a3c', group: 'main', anim: true },
        { key: 'mode', label: '混合', type: 'select', default: 'soft-light', group: 'main', options: BLENDS }],
      draw(ctx, pr, W, H, k) {
        ctx.globalCompositeOperation = pr.mode;
        ctx.globalAlpha = clamp(pr.amount * k, 0, 1);
        ctx.fillStyle = rgba(pr.color); ctx.fillRect(0, 0, W, H);
      },
    },
    lightLeak: {
      label: '漏光', props: [amountProp(0.5), { key: 'color', label: '顏色 1', type: 'color', default: '#ff7a3c', group: 'main', anim: true },
        { key: 'color2', label: '顏色 2', type: 'color', default: '#ffd36b', group: 'main', anim: true },
        { key: 'speed', label: '速度', type: 'range', min: 0, max: 3, step: 0.05, default: 1, group: 'main' }],
      draw(ctx, pr, W, H, k, lt) {
        ctx.globalCompositeOperation = 'screen';
        [[pr.color, 0], [pr.color2, 1]].forEach(([c, i]) => {
          const x = W * (0.5 + 0.6 * Math.sin(lt * 0.35 * pr.speed + i * 2.2)), y = H * (0.5 + 0.5 * Math.cos(lt * 0.27 * pr.speed + i * 1.3));
          const g = ctx.createRadialGradient(x, y, 0, x, y, W * 0.55);
          g.addColorStop(0, rgba(c, clamp(pr.amount * k, 0, 1))); g.addColorStop(1, rgba(c, 0));
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        });
      },
    },
    fade: {
      label: '黑場淡入淡出', props: [{ key: 'color', label: '顏色', type: 'color', default: '#000000', group: 'main', anim: true },
        { key: 'mode', label: '方向', type: 'select', default: 'out', group: 'main', options: [['out', '畫面漸漸變成顏色'], ['in', '由顏色漸漸出現']] }],
      draw(ctx, pr, W, H, k, lt, dur, since) {
        const p = ease('sine', dur > 0 ? since / dur : 1);
        ctx.globalAlpha = clamp((pr.mode === 'in' ? 1 - p : p) * k, 0, 1);
        ctx.fillStyle = rgba(pr.color); ctx.fillRect(0, 0, W, H);
      },
    },
    flash: {
      label: '閃白', props: [amountProp(1), { key: 'color', label: '顏色', type: 'color', default: '#ffffff', group: 'main', anim: true }],
      draw(ctx, pr, W, H, k, lt, dur, since) {
        ctx.globalAlpha = clamp(pr.amount * k * Math.pow(1 - clamp(since / Math.max(0.01, dur), 0, 1), 2), 0, 1);
        ctx.fillStyle = rgba(pr.color); ctx.fillRect(0, 0, W, H);
      },
    },
    letterbox: {
      label: '電影黑邊', props: [{ key: 'ratio', label: '畫面比例', type: 'select', default: 2.35, group: 'main', options: [[2.35, '2.35：1'], [2, '2：1'], [1.85, '1.85：1']] },
        { key: 'color', label: '顏色', type: 'color', default: '#000000', group: 'main' }],
      draw(ctx, pr, W, H, k) {
        const bar = Math.max(0, (H - W / pr.ratio) / 2) * clamp(k, 0, 1);
        ctx.fillStyle = rgba(pr.color);
        ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
      },
    },
  };

  // Transitions: progress p = 0..1 across the clip, fully covered at p = 0.5
  const TRANSITIONS = {
    fadeThrough: {
      label: '淡化過場', props: [{ key: 'color', label: '顏色', type: 'color', default: '#000000', group: 'main' }],
      draw(ctx, pr, W, H, p) {
        ctx.globalAlpha = ease('sine', 1 - Math.abs(2 * p - 1));
        ctx.fillStyle = rgba(pr.color); ctx.fillRect(0, 0, W, H);
      },
    },
    wipe: {
      label: '推移擦除', props: [{ key: 'color', label: '顏色', type: 'color', default: '#111111', group: 'main' },
        { key: 'dir', label: '方向', type: 'select', default: 'right', group: 'main', options: [['right', '向右'], ['left', '向左'], ['down', '向下'], ['up', '向上']] }],
      draw(ctx, pr, W, H, p) {
        const a = ease('easeInOut', clamp(p * 2, 0, 1)), b = ease('easeInOut', clamp(p * 2 - 1, 0, 1));
        const horiz = pr.dir === 'right' || pr.dir === 'left';
        const L = horiz ? W : H;
        let s = b * L, e = a * L;
        if (pr.dir === 'left' || pr.dir === 'up') { const s2 = L - e; e = L - s; s = s2; }
        ctx.fillStyle = rgba(pr.color);
        if (horiz) ctx.fillRect(s, 0, e - s, H); else ctx.fillRect(0, s, W, e - s);
      },
    },
    iris: {
      label: '圓形轉場', props: [{ key: 'color', label: '顏色', type: 'color', default: '#000000', group: 'main' }],
      draw(ctx, pr, W, H, p) {
        const r = Math.hypot(W, H) / 2 * ease('easeInOut', Math.abs(2 * p - 1));
        ctx.fillStyle = rgba(pr.color);
        ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, Math.max(0.1, r), 0, Math.PI * 2, true); ctx.fill();
      },
    },
    blinds: {
      label: '百葉窗', props: [{ key: 'color', label: '顏色', type: 'color', default: '#000000', group: 'main' },
        { key: 'count', label: '葉片數', type: 'number', min: 2, max: 40, step: 1, default: 10, group: 'main' }],
      draw(ctx, pr, W, H, p) {
        const k = ease('easeInOut', 1 - Math.abs(2 * p - 1));
        const n = Math.max(2, Math.round(pr.count)), band = H / n;
        ctx.fillStyle = rgba(pr.color);
        for (let i = 0; i < n; i++) ctx.fillRect(0, i * band, W, band * k + 0.5);
      },
    },
    zoom: {
      label: '衝擊縮放', props: [{ key: 'amount', label: '強度', type: 'range', min: 0, max: 1, step: 0.01, default: 0.5, group: 'main' }],
      draw(ctx, pr, W, H, p) {
        const k = Math.sin(Math.PI * p);
        if (k < 0.001) return;
        const src = snapshot(ctx, W, H), s = 1 + k * 0.4 * pr.amount;
        ctx.filter = `blur(${k * 14 * pr.amount}px)`;
        ctx.drawImage(src, W / 2 - (W * s) / 2, H / 2 - (H * s) / 2, W * s, H * s);
        ctx.filter = 'none';
        ctx.globalAlpha = k * 0.6 * pr.amount; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      },
    },
  };

  for (const [name, fx] of Object.entries(EFFECTS)) {
    registerType('fx_' + name, {
      label: fx.label, category: 'effect', screen: true, props: fx.props,
      draw(p, pr, env) { fx.draw(p.drawingContext, pr, env.W, env.H, env.st.alpha, env.lt, env.clip.duration, env.t - env.clip.start); },
    });
  }
  for (const [name, tr] of Object.entries(TRANSITIONS)) {
    registerType('tr_' + name, {
      label: tr.label, category: 'transition', screen: true, props: tr.props,
      draw(p, pr, env) { tr.draw(p.drawingContext, pr, env.W, env.H, clamp((env.t - env.clip.start) / Math.max(0.01, env.clip.duration), 0, 1)); },
    });
  }
})();

</script>
<script>
// Synth voices ported from the p5-comfyui-animation sound.js kit so legacy SCORE objects play unchanged.
// Every voice: (ctx, destinationNode, startTime, ...args)
(function () {
  const P5M = window.P5M;

  const midiToHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function makeReverb(ctx, seconds = 2.6) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  function envGain(ctx, dest, t, attack, peak, decay) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(dest);
    return g;
  }

  function noiseSource(ctx, t, len) {
    if (!ctx._noise) {
      const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      ctx._noise = buf;
    }
    const src = ctx.createBufferSource();
    src.buffer = ctx._noise;
    src.loop = true;
    src.start(t, Math.random() * 1.5);
    src.stop(t + len + 0.1);
    return src;
  }

  function biquad(ctx, type, freq, q = 1) {
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = q;
    return f;
  }

  // ---------- tonal voices ----------
  function pluck(ctx, bus, t, midi, durSec = 1, vol = 0.22) {
    const f = midiToHz(midi);
    const decay = Math.max(1.2, durSec * 1.6);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f * 8, t);
    lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + decay);
    const g = envGain(ctx, lp, t, 0.005, vol, decay);
    lp.connect(bus);
    [[1, 'triangle', 1], [2, 'sine', 0.35], [3, 'sine', 0.12]].forEach(([mult, type, amp]) => {
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = type;
      o.frequency.value = f * mult;
      og.gain.value = amp;
      o.connect(og).connect(g);
      o.start(t);
      o.stop(t + decay + 0.1);
    });
  }

  function pad(ctx, bus, t, notes, len, vol = 0.045) {
    notes.forEach((m) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = midiToHz(m);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.9);
      g.gain.setValueAtTime(vol, t + len - 0.6);
      g.gain.linearRampToValueAtTime(0.0001, t + len + 0.4);
      o.connect(g).connect(bus);
      o.start(t);
      o.stop(t + len + 0.5);
    });
  }

  function chime(ctx, bus, t, vol = 0.08) {
    [1568, 2349, 3136].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      o.connect(envGain(ctx, bus, t + i * 0.06, 0.004, vol / (i + 1), 2.2));
      o.start(t + i * 0.06);
      o.stop(t + 2.5);
    });
  }

  function glissando(ctx, bus, t, notes = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81], step = 0.045, vol = 0.1) {
    notes.forEach((m, i) => pluck(ctx, bus, t + i * step, m, 0.6, vol));
  }

  function shimmer(ctx, bus, t, len = 2, vol = 0.03) {
    for (let i = 0; i < 14; i++) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = 2000 + Math.random() * 3000;
      const s = t + (i / 14) * len * 0.7;
      o.connect(envGain(ctx, bus, s, 0.01, vol, 0.5));
      o.start(s);
      o.stop(s + 0.6);
    }
  }

  function pop(ctx, bus, t, vol = 0.16) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(1300, t + 0.07);
    o.connect(envGain(ctx, bus, t, 0.004, vol, 0.12));
    o.start(t);
    o.stop(t + 0.2);
  }

  function thud(ctx, bus, t, vol = 0.4, pitch = 1) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(190 * pitch, t);
    o.frequency.exponentialRampToValueAtTime(80 * pitch, t + 0.12);
    o.connect(envGain(ctx, bus, t, 0.003, vol, 0.18));
    o.start(t);
    o.stop(t + 0.25);
    const n = noiseSource(ctx, t, 0.06);
    n.connect(biquad(ctx, 'bandpass', 1400 * pitch, 3)).connect(envGain(ctx, bus, t, 0.002, vol * 0.5, 0.04));
  }

  // ---------- creature voices ----------
  function meow(ctx, dest, t, pitch = 1, dur = 0.75) {
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(430 * pitch, t);
    o.frequency.linearRampToValueAtTime(820 * pitch, t + dur * 0.3);
    o.frequency.linearRampToValueAtTime(700 * pitch, t + dur * 0.6);
    o.frequency.linearRampToValueAtTime(420 * pitch, t + dur);
    const vib = ctx.createOscillator();
    const vibAmt = ctx.createGain();
    vib.frequency.value = 7;
    vibAmt.gain.value = 14 * pitch;
    vib.connect(vibAmt).connect(o.frequency);
    const formant = ctx.createBiquadFilter();
    formant.type = 'bandpass';
    formant.Q.value = 2.5;
    formant.frequency.setValueAtTime(800, t);
    formant.frequency.linearRampToValueAtTime(1700, t + dur * 0.35);
    formant.frequency.linearRampToValueAtTime(950, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.06);
    g.gain.setValueAtTime(0.5, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(formant).connect(g).connect(dest);
    o.start(t);
    vib.start(t);
    o.stop(t + dur + 0.05);
    vib.stop(t + dur + 0.05);
  }

  function purr(ctx, dest, t, len = 3) {
    const src = noiseSource(ctx, t, len);
    const flutter = ctx.createGain();
    flutter.gain.value = 0.5;
    const lfo = ctx.createOscillator();
    const lfoAmt = ctx.createGain();
    lfo.frequency.value = 25;
    lfoAmt.gain.value = 0.5;
    lfo.connect(lfoAmt).connect(flutter.gain);
    const breath = ctx.createGain();
    breath.gain.setValueAtTime(0.0001, t);
    for (let s = t; s < t + len; s += 1.6) {
      breath.gain.linearRampToValueAtTime(0.9, s + 0.72);
      breath.gain.linearRampToValueAtTime(0.25, s + 1.6);
    }
    breath.gain.linearRampToValueAtTime(0.0001, t + len);
    src.connect(biquad(ctx, 'lowpass', 260)).connect(flutter).connect(breath).connect(dest);
    lfo.start(t);
    lfo.stop(t + len + 0.1);
  }

  function sniff(ctx, dest, t, count = 3, vol = 0.25) {
    for (let i = 0; i < count; i++) {
      const s = t + i * 0.16;
      noiseSource(ctx, s, 0.12).connect(biquad(ctx, 'bandpass', 2600, 2))
        .connect(envGain(ctx, dest, s, 0.02, vol, 0.08));
    }
  }

  function crickets(ctx, dest, t, len = 10, vol = 0.02) {
    for (let s = t; s < t + len; s += 0.8 + Math.random() * 0.5) {
      for (let k = 0; k < 3; k++) {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = 4300;
        const p = s + k * 0.055;
        o.connect(envGain(ctx, dest, p, 0.004, vol, 0.035));
        o.start(p);
        o.stop(p + 0.05);
      }
    }
  }

  // ---------- noise effects ----------
  function whoosh(ctx, dest, t, dur = 0.6, up = true, vol = 0.25) {
    const bp = biquad(ctx, 'bandpass', up ? 400 : 3000, 1.5);
    bp.frequency.exponentialRampToValueAtTime(up ? 3000 : 400, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * 0.6);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    noiseSource(ctx, t, dur).connect(bp).connect(g).connect(dest);
  }

  function strike(ctx, dest, t, vol = 0.3) {
    const bp = biquad(ctx, 'bandpass', 5000, 1.2);
    bp.frequency.exponentialRampToValueAtTime(1500, t + 0.25);
    noiseSource(ctx, t, 0.3).connect(bp).connect(envGain(ctx, dest, t, 0.005, vol, 0.25));
  }

  function sizzle(ctx, dest, t, len = 5, vol = 0.05) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.8);
    g.gain.setValueAtTime(vol, t + len - 0.8);
    g.gain.linearRampToValueAtTime(0.0001, t + len);
    noiseSource(ctx, t, len).connect(biquad(ctx, 'highpass', 3500)).connect(g).connect(dest);
  }

  function crackle(ctx, dest, t, len = 3, density = 6, vol = 0.18) {
    const n = Math.floor(len * density);
    for (let i = 0; i < n; i++) {
      const s = t + Math.random() * len;
      const a = vol * (0.3 + Math.random() * 0.7);
      noiseSource(ctx, s, 0.03).connect(biquad(ctx, 'bandpass', 1500 + Math.random() * 2500, 2))
        .connect(envGain(ctx, dest, s, 0.001, a, 0.02 + Math.random() * 0.03));
    }
  }

  function roll(ctx, dest, t, len = 1.5, vol = 0.3) {
    const am = ctx.createGain();
    am.gain.value = 0.5;
    const lfo = ctx.createOscillator();
    const lfoAmt = ctx.createGain();
    lfo.frequency.value = 9;
    lfoAmt.gain.value = 0.5;
    lfo.connect(lfoAmt).connect(am.gain);
    lfo.start(t);
    lfo.stop(t + len + 0.1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.2);
    g.gain.setValueAtTime(vol, t + len * 0.7);
    g.gain.linearRampToValueAtTime(0.0001, t + len);
    noiseSource(ctx, t, len).connect(biquad(ctx, 'lowpass', 380)).connect(am).connect(g).connect(dest);
  }

  P5M.voices = {
    midiToHz, makeReverb, envGain, noiseSource, biquad, pad,
    VOICES: { pluck, chime, glissando, shimmer, pop, thud, meow, purr, sniff, crickets, whoosh, strike, sizzle, crackle, roll },
    MUSIC_VOICES: new Set(['pluck', 'chime', 'glissando', 'shimmer']),
  };
})();

</script>
<script>
// Audio clip types (music score, synth sound effect, audio file) and the playback engine.
// Each play() builds a fresh AudioContext and schedules every audible clip against it; stop() closes it.
// Project time T maps to context time: ctxStart + (T - fromT).
(function () {
  const P5M = window.P5M;
  const { registerType, hash, clamp } = P5M;
  const V = P5M.voices;

  // ---------- mood presets -> generated SCORE (same shape as legacy sound.js scores) ----------
  const MOODS = {
    warm: { label: '溫馨', bpm: 84, bpc: 4, density: 0.55, chords: { F: [53, 57, 60], C: [48, 52, 55], Dm: [50, 53, 57], Bb: [46, 50, 53] },
      prog: ['F', 'C', 'Dm', 'Bb'], scale: [65, 67, 69, 72, 74, 77, 79, 81] },
    festive: { label: '喜慶', bpm: 108, bpc: 4, density: 0.8, chime: 4, chords: { C: [48, 52, 55], Am: [45, 48, 52], F: [41, 45, 48], G: [43, 47, 50] },
      prog: ['C', 'Am', 'F', 'G'], scale: [72, 74, 76, 79, 81, 84, 86, 88] },
    calm: { label: '寧靜', bpm: 66, bpc: 8, density: 0.22, chords: { D: [50, 54, 57], Bm: [47, 50, 54], G: [43, 47, 50], A: [45, 49, 52] },
      prog: ['D', 'Bm', 'G', 'A'], scale: [74, 76, 78, 81, 83, 86] },
    romantic: { label: '浪漫', bpm: 78, bpc: 4, density: 0.45, chords: { Fmaj7: [53, 57, 60, 64], Em7: [52, 55, 59, 62], Dm7: [50, 53, 57, 60], Cmaj7: [48, 52, 55, 59] },
      prog: ['Fmaj7', 'Em7', 'Dm7', 'Cmaj7'], scale: [72, 74, 76, 77, 79, 81, 84] },
    happy: { label: '歡樂', bpm: 124, bpc: 4, density: 0.9, chords: { C: [48, 52, 55], G: [43, 47, 50], Am: [45, 48, 52], F: [41, 45, 48] },
      prog: ['C', 'G', 'Am', 'F'], scale: [72, 74, 76, 79, 81, 84] },
    mystery: { label: '神秘', bpm: 72, bpc: 4, density: 0.35, chords: { Am: [45, 48, 52], F: [41, 45, 48], Dm: [50, 53, 57], E: [40, 44, 47] },
      prog: ['Am', 'F', 'Dm', 'E'], scale: [69, 71, 72, 74, 76, 77, 80, 81] },
  };

  const scoreCache = new Map();
  function moodScore(name, seconds, seed = 1) {
    const m = MOODS[name] || MOODS.warm;
    const beat = 60 / m.bpm;
    const nChords = Math.max(1, Math.ceil(seconds / (m.bpc * beat)));
    const key = name + '|' + nChords + '|' + seed;
    if (scoreCache.has(key)) return scoreCache.get(key);
    const progression = [...Array(nChords)].map((_, i) => m.prog[i % m.prog.length]);
    const melody = [];
    let idx = Math.floor(m.scale.length / 2);
    for (let b = 0; b < nChords * m.bpc; b++) {
      const strong = b % m.bpc === 0;
      if (hash(b, seed) < m.density * (strong ? 1.2 : 0.75)) {
        idx = clamp(idx + Math.round((hash(b + 500, seed) - 0.5) * 4), 0, m.scale.length - 1);
        melody.push([b, m.scale[idx], strong ? 2 : 1]);
      }
      if (m.density > 0.7 && hash(b + 900, seed) < m.density - 0.5) {
        const j = clamp(idx + (hash(b + 1300, seed) < 0.5 ? 1 : -1), 0, m.scale.length - 1);
        melody.push([b + 0.5, m.scale[j], 0.5]);
      }
    }
    const cues = [[0, 'shimmer', 2, 0.02]];
    if (m.chime) for (let c = 0; c < nChords; c += m.chime) cues.push([c * m.bpc * beat, 'chime', 0.05]);
    const score = { bpm: m.bpm, beatsPerChord: m.bpc, chords: m.chords, progression, melody, cues };
    scoreCache.set(key, score);
    return score;
  }

  // ---------- sound effect catalogue: default clip length and how clip props map to voice args ----------
  // Volume is applied by the clip lane, so args carry only the voice's own base level.
  const SFX = {
    pop: { label: '啵', dur: 0.3, args: () => [] },
    thud: { label: '咚（敲擊）', dur: 0.4, args: (pr) => [0.4, pr.pitch] },
    chime: { label: '叮（鈴聲）', dur: 2.5, music: true, args: () => [] },
    glissando: { label: '上行琶音', dur: 1, music: true, args: () => [] },
    shimmer: { label: '閃亮音', dur: 2, music: true, args: (pr, len) => [len] },
    pluck: { label: '撥弦單音', dur: 1.5, music: true, args: (pr, len) => [pr.note, len] },
    whoosh: { label: '咻（風聲）', dur: 0.6, args: (pr, len) => [len, pr.up] },
    strike: { label: '擦火柴', dur: 0.4, args: () => [] },
    meow: { label: '貓叫', dur: 0.8, args: (pr, len) => [pr.pitch, Math.min(len, 3)] },
    purr: { label: '呼嚕', dur: 3, args: (pr, len) => [len] },
    sniff: { label: '嗅聞', dur: 0.6, args: (pr) => [Math.max(1, Math.round(pr.count))] },
    crickets: { label: '蟲鳴', dur: 6, args: (pr, len) => [len] },
    sizzle: { label: '滋滋聲', dur: 4, args: (pr, len) => [Math.max(len, 1.6)] },
    crackle: { label: '劈啪（鞭炮）', dur: 3, args: (pr, len) => [len, pr.density] },
    roll: { label: '滾動隆隆', dur: 1.5, args: (pr, len) => [len] },
  };
  // Continuous textures that can start mid-way when playback begins inside the clip
  const RESUMABLE = new Set(['shimmer', 'purr', 'crickets', 'sizzle', 'crackle', 'roll']);

  const volumeProp = { key: 'volume', label: '音量', type: 'range', min: 0, max: 2, step: 0.01, default: 1, group: 'main' };
  const fadeInProp = { key: 'fadeIn', label: '淡入（秒）', type: 'number', min: 0, step: 0.1, default: 0, group: 'main' };
  const fadeOutProp = { key: 'fadeOut', label: '淡出（秒）', type: 'number', min: 0, step: 0.1, default: 0, group: 'main' };

  registerType('music', {
    label: '配樂', category: 'audio', audio: true,
    props: [
      { key: 'preset', label: '曲風', type: 'select', default: 'warm', group: 'main',
        options: [...Object.entries(MOODS).map(([k, v]) => [k, v.label]), ['score', '匯入的樂譜']] },
      { key: 'seed', label: '旋律變化', type: 'number', step: 1, default: 1, group: 'main', when: (pr) => pr.preset !== 'score' },
      { ...volumeProp, default: 0.8 }, fadeInProp, { ...fadeOutProp, default: 1.5 },
    ],
    schedule(eng, clip, pr, lane) {
      const score = pr.preset === 'score' ? pr.score : moodScore(pr.preset, (clip.offset || 0) + clip.duration, pr.seed);
      if (score) scheduleScore(eng, clip, score, lane);
    },
  });

  registerType('sfx', {
    label: '音效', category: 'audio', audio: true,
    props: [
      { key: 'voice', label: '音效', type: 'select', default: 'pop', group: 'main', options: Object.entries(SFX).map(([k, v]) => [k, v.label]) },
      { key: 'pitch', label: '音高', type: 'range', min: 0.4, max: 2.5, step: 0.01, default: 1, group: 'main', when: (pr) => pr.voice === 'meow' || pr.voice === 'thud' },
      { key: 'note', label: '音符（MIDI）', type: 'number', min: 24, max: 108, step: 1, default: 72, group: 'main', when: (pr) => pr.voice === 'pluck' },
      { key: 'up', label: '上升', type: 'bool', default: true, group: 'main', when: (pr) => pr.voice === 'whoosh' },
      { key: 'count', label: '次數', type: 'number', min: 1, max: 12, step: 1, default: 3, group: 'main', when: (pr) => pr.voice === 'sniff' },
      { key: 'density', label: '密度（次/秒）', type: 'number', min: 0.5, max: 40, step: 0.5, default: 6, group: 'main', when: (pr) => pr.voice === 'crackle' },
      volumeProp,
    ],
    schedule(eng, clip, pr, lane) {
      const sfx = SFX[pr.voice];
      if (!sfx) return;
      const T0 = clip.start - (clip.offset || 0); // when the sound itself begins
      const from = Math.max(clip.start, eng.fromT); // audible window is [start, start + duration) only
      if (T0 < from && !RESUMABLE.has(pr.voice)) return;
      const at = Math.max(T0, from), len = clip.start + clip.duration - at;
      if (len < 0.1) return;
      V.VOICES[pr.voice](eng.ctx, sfx.music ? lane.music : lane.sfx, eng.time(at), ...sfx.args(pr, len));
    },
  });

  registerType('audiofile', {
    label: '音訊檔', category: 'audio', audio: true,
    props: [{ key: 'asset', label: '音訊', type: 'asset', accept: 'audio', group: 'main' }, volumeProp, fadeInProp, fadeOutProp],
    schedule(eng, clip, pr, lane) {
      const buf = eng.buffers.get(pr.asset);
      if (!buf) return;
      const skip = Math.max(0, eng.fromT - clip.start);
      const offset = (clip.offset || 0) + skip;
      const len = clip.duration - skip;
      if (len <= 0.01 || offset >= buf.duration) return;
      const src = eng.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(lane.sfx);
      src.start(eng.time(clip.start + skip), offset, len);
    },
  });

  // Score time st maps to project time clip.start + (st - offset); only [offset, offset + duration) is audible
  function scheduleScore(eng, clip, score, lane) {
    const { ctx } = eng;
    const beat = 60 / score.bpm, bpc = score.beatsPerChord || 4;
    const a = clip.offset || 0, b = a + clip.duration;
    const proj = (st) => clip.start + (st - a);
    const due = (st) => st >= a - 0.05 && st < b && proj(st) >= eng.fromT - 0.02;
    (score.progression || []).forEach((name, i) => {
      const st = i * bpc * beat, len = bpc * beat, notes = score.chords[name];
      if (!notes || st >= b || st + len <= a) return;
      const T = Math.max(proj(st), eng.fromT);
      const remain = proj(st) + len - T;
      if (remain > 0.3) V.pad(ctx, lane.music, eng.time(T), notes, remain);
    });
    (score.melody || []).forEach(([bt, midi, dur]) => {
      const st = bt * beat;
      if (due(st)) V.VOICES.pluck(ctx, lane.music, eng.time(proj(st)), midi, dur * beat);
    });
    (score.cues || []).forEach(([sec, voice, ...args]) => {
      const fn = V.VOICES[voice];
      if (!fn) { console.warn('未知的音效名稱：' + voice); return; }
      if (due(sec)) fn(ctx, V.MUSIC_VOICES.has(voice) ? lane.music : lane.sfx, eng.time(proj(sec)), ...args);
    });
    // legacy SCORE.fadeOut faded the whole master in sound.js; here it fades this clip's lanes
    if (score.fadeOut) for (const g of lane.fades) automate(eng, g, [[proj(score.fadeOut[0]), 1], [proj(score.fadeOut[1]), 0]]);
  }

  // Piecewise-linear automation in project time, starting from its value at the play head
  function automate(eng, param, points) {
    const valueAt = (T) => {
      if (T <= points[0][0]) return points[0][1];
      for (let i = 1; i < points.length; i++) {
        const [t1, v1] = points[i], [t0, v0] = points[i - 1];
        if (T <= t1) return t1 > t0 ? v0 + ((v1 - v0) * (T - t0)) / (t1 - t0) : v1;
      }
      return points[points.length - 1][1];
    };
    param.setValueAtTime(valueAt(eng.fromT), eng.ctxStart);
    for (const [T, v] of points) if (T > eng.fromT) param.linearRampToValueAtTime(v, eng.time(T));
  }

  // Two lanes per clip (music -> music bus, sfx -> sfx bus), each gated by the clip's volume and fades
  // and hard-cut at the clip edges; `fades` are extra gains for a legacy score's fadeOut.
  function clipLanes(eng, clip, pr, musicBus, sfxBus) {
    const vol = pr.volume ?? 1;
    const s = clip.start, e = clip.start + clip.duration;
    const fi = Math.max(0.005, Math.min(pr.fadeIn || 0, clip.duration / 2));
    const fo = Math.max(0.005, Math.min(pr.fadeOut || 0, clip.duration / 2));
    const envelope = [[s, 0], [s + fi, vol], [e - fo, vol], [e, 0]];
    const lane = (dest) => {
      const gate = eng.ctx.createGain(), fade = eng.ctx.createGain();
      gate.connect(fade).connect(dest);
      automate(eng, gate.gain, envelope);
      return { gate, fade: fade.gain };
    };
    const m = lane(musicBus), x = lane(sfxBus);
    return { music: m.gate, sfx: x.gate, fades: [m.fade, x.fade] };
  }

  // ---------- engine ----------
  const engine = {
    session: null,

    // Plays every unmuted audio track from project time fromT. opts.record adds a MediaStream output (session.stream).
    async play(project, fromT, opts = {}) {
      engine.stop();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Freeze the clock while scheduling (can take a few hundred ms) so the first notes are not late
      const hold = ctx.suspend().catch(() => {});
      const eng = {
        ctx, fromT, ctxStart: ctx.currentTime + 0.12, perf0: performance.now(), buffers: new Map(), stream: null,
        time(T) { return Math.max(0, this.ctxStart + (T - fromT)); },
        // Current project time; falls back to the wall clock when the context is not running (autoplay blocked)
        now() {
          if (ctx.state === 'running') return fromT + Math.max(0, ctx.currentTime - this.ctxStart);
          return fromT + Math.max(0, (performance.now() - this.perf0) / 1000 - 0.12);
        },
        stop() { if (ctx.state !== 'closed') ctx.close().catch(() => {}); },
      };
      engine.session = eng;

      const master = ctx.createGain();
      master.gain.value = project.settings.volume ?? 1;
      master.connect(ctx.destination);
      if (opts.record) {
        const dest = ctx.createMediaStreamDestination();
        master.connect(dest);
        eng.stream = dest.stream;
      }
      // routing from sound.js: music bus fully into reverb, sfx with a 25% send
      const reverb = V.makeReverb(ctx);
      const wet = ctx.createGain(); wet.gain.value = 0.35;
      reverb.connect(wet).connect(master);
      const musicBus = ctx.createGain(); musicBus.gain.value = 0.8;
      musicBus.connect(master); musicBus.connect(reverb);
      const sfxBus = ctx.createGain(); sfxBus.connect(master);
      const send = ctx.createGain(); send.gain.value = 0.25;
      sfxBus.connect(send).connect(reverb);

      const clips = [];
      for (const tr of project.tracks) {
        if (tr.kind !== 'audio' || tr.muted) continue;
        for (const c of tr.clips) {
          const def = P5M.types[c.type];
          if (def && def.schedule && c.start + c.duration > fromT) clips.push(c);
        }
      }
      await Promise.all(clips.filter((c) => c.type === 'audiofile' && c.props.asset).map(async (c) => {
        const buf = await P5M.assets.audioBuffer(project.assets[c.props.asset]);
        if (buf) eng.buffers.set(c.props.asset, buf);
      }));
      if (engine.session !== eng) return eng; // stopped or restarted while decoding
      for (const c of clips) {
        const pr = P5M.resolveProps(c, 0, project.settings);
        try { P5M.types[c.type].schedule(eng, c, pr, clipLanes(eng, c, pr, musicBus, sfxBus)); }
        catch (err) { console.error('音訊排程失敗', c.type, c.id, err); }
      }
      await hold;
      if (engine.session !== eng) return eng;
      eng.perf0 = performance.now();
      ctx.resume().catch(() => {}); // not awaited: stays pending forever when autoplay is blocked
      return eng;
    },

    stop() {
      if (engine.session) { engine.session.stop(); engine.session = null; }
    },

    // Audition one audio clip from its beginning (library click, inspector preview)
    preview(clip, project) {
      const mini = { settings: project.settings, assets: project.assets, tracks: [{ kind: 'audio', clips: [{ ...clip, start: 0 }] }] };
      return engine.play(mini, 0);
    },
  };

  P5M.audio = engine;
  P5M.music = { MOODS, moodScore };
  P5M.sfxCatalog = SFX;
})();

</script>
<script>
// Project model helpers and the frame renderer: renderFrame(p, project, t) paints one frame as a pure function of t.
//
// project = {
//   format: 'p5maker', version: 1,
//   settings: { width, height, fps, duration, background, volume },
//   assets:   { [id]: { id, kind: 'image' | 'audio' | 'legacy', name, src, w?, h?, ... } },
//   camera:   { props: { x, y, zoom, rotation, shake }, keys: { [prop]: [{ t, v, e }] } },   // keys in project seconds
//   tracks:   [{ id, name, kind: 'visual' | 'audio', hidden, muted, locked, followCamera, clips: [clip] }],  // index 0 = top
// }
// clip = { id, type, name, start, duration, offset, props, keys, anim, blend }
(function () {
  const P5M = window.P5M;
  const { types, clamp, resolveProps, localTime, isActive, sampleKeys, noise, uid } = P5M;

  const CAMERA_DEFAULTS = (s) => ({ x: s.width / 2, y: s.height / 2, zoom: 1, rotation: 0, shake: 0 });

  function newProject(opts = {}) {
    const settings = { width: 1280, height: 720, fps: 30, duration: 10, background: '#101018', volume: 1, ...opts };
    return {
      format: 'p5maker', version: 1, settings, assets: {},
      camera: { props: CAMERA_DEFAULTS(settings), keys: {} },
      tracks: [
        { id: uid('tr'), name: '軌道 1', kind: 'visual', clips: [] },
        { id: uid('tr'), name: '音訊 1', kind: 'audio', clips: [] },
      ],
    };
  }

  // Fill missing fields so older or hand-written (Claude-made) JSON renders; returns a new object
  function normalizeProject(src) {
    const settings = { width: 1280, height: 720, fps: 30, duration: 10, background: '#101018', volume: 1, ...(src.settings || {}) };
    const tracks = (src.tracks || []).map((tr, i) => ({
      id: tr.id || uid('tr'), name: tr.name || '軌道 ' + (i + 1), kind: tr.kind === 'audio' ? 'audio' : 'visual',
      hidden: !!tr.hidden, muted: !!tr.muted, locked: !!tr.locked, followCamera: tr.followCamera !== false,
      clips: (tr.clips || []).map((c) => ({
        id: c.id || uid('c'), type: c.type, name: c.name || '', start: +c.start || 0, duration: Math.max(0.05, +c.duration || 1),
        offset: +c.offset || 0, props: { ...(c.props || {}) }, keys: { ...(c.keys || {}) }, anim: c.anim ? { ...c.anim } : {}, blend: c.blend || 'source-over',
      })),
    }));
    const cam = src.camera || {};
    const assets = {};
    for (const [id, a] of Object.entries(src.assets || {})) assets[id] = { ...a, name: a.name || id };
    return {
      format: 'p5maker', version: 1, title: src.title || '', settings, assets,
      camera: { props: { ...CAMERA_DEFAULTS(settings), ...(cam.props || {}) }, keys: { ...(cam.keys || {}) } },
      tracks,
    };
  }

  // Latest clip end across all tracks (the editor can extend settings.duration to this)
  function contentEnd(project) {
    let end = 0;
    for (const tr of project.tracks) for (const c of tr.clips) end = Math.max(end, c.start + c.duration);
    return end;
  }

  function cameraAt(project, t) {
    const cam = project.camera || { props: {}, keys: {} };
    const out = { ...CAMERA_DEFAULTS(project.settings), ...cam.props };
    for (const k in cam.keys) if (cam.keys[k] && cam.keys[k].length) out[k] = sampleKeys(cam.keys[k], t);
    return out;
  }

  function cameraMatrix(project, t) {
    const { width: W, height: H } = project.settings;
    const c = cameraAt(project, t);
    let sx = 0, sy = 0;
    if (c.shake > 0) { sx = (noise(t * 9, 0, 0, 7) - 0.5) * 2 * c.shake; sy = (noise(0, t * 9, 0, 11) - 0.5) * 2 * c.shake; }
    return new DOMMatrix().translate(W / 2, H / 2).scale(c.zoom).rotate(-c.rotation).translate(-c.x + sx, -c.y + sy);
  }

  function filterString(pr, extraBlur) {
    const parts = [];
    const blur = (pr.blur || 0) + (extraBlur || 0);
    if (blur > 0.05) parts.push(`blur(${blur.toFixed(2)}px)`);
    if (pr.brightness !== undefined && pr.brightness !== 1) parts.push(`brightness(${pr.brightness})`);
    if (pr.contrast !== undefined && pr.contrast !== 1) parts.push(`contrast(${pr.contrast})`);
    if (pr.saturate !== undefined && pr.saturate !== 1) parts.push(`saturate(${pr.saturate})`);
    if (pr.hue) parts.push(`hue-rotate(${pr.hue}deg)`);
    return parts.length ? parts.join(' ') : 'none';
  }

  function clipReveal(ctx, rv, b) {
    const p = clamp(rv.p, 0, 1);
    ctx.beginPath();
    if (rv.dir === 'iris') ctx.arc(0, 0, Math.hypot(b.w, b.h) / 2 * p, 0, Math.PI * 2);
    else if (rv.dir === 'left') ctx.rect(b.w / 2 - b.w * p, -b.h / 2, b.w * p, b.h);
    else ctx.rect(-b.w / 2, -b.h / 2, b.w * p, b.h);
    ctx.clip();
  }

  const warned = new Set();
  function drawClip(p, def, pr, env) {
    try { def.draw.call(def, p, pr, env); } catch (err) {
      if (!warned.has(env.clip.id)) { warned.add(env.clip.id); console.error('圖層繪製失敗', env.clip.type, env.clip.id, err); }
    }
  }

  // Chrome spends several ms per draw call while ctx.filter is set, so a clip that draws many shapes under a blur
  // (particles, clouds, per-glyph text) took 200-900 ms a frame. Such clips are painted unfiltered into a
  // frame-sized scratch canvas, then composited once with the filter and the clip's blend mode. Alpha is applied
  // per shape inside the layer, as on the direct path, so overlaps look the same when the filter turns off.
  let layer = null;
  function drawFiltered(p, def, pr, env, filter, reveal, b) {
    const ctx = p.drawingContext, r = p._renderer;
    const c = layer || (layer = document.createElement('canvas'));
    if (c.width !== ctx.canvas.width || c.height !== ctx.canvas.height) { c.width = ctx.canvas.width; c.height = ctx.canvas.height; }
    const lc = c.getContext('2d');
    lc.save();
    lc.clearRect(0, 0, c.width, c.height);
    lc.setTransform(ctx.getTransform());
    lc.globalAlpha = ctx.globalAlpha;
    if (reveal) clipReveal(ctx, reveal, b); // on ctx, so the filtered result is clipped as before
    // types draw through p.drawingContext, and p5 calls (code clips) through the renderer: point both at the layer
    const cached = [r._cachedFillStyle, r._cachedStrokeStyle];
    p.drawingContext = r.drawingContext = lc;
    r._cachedFillStyle = r._cachedStrokeStyle = undefined;
    try { drawClip(p, def, pr, env); } finally {
      p.drawingContext = r.drawingContext = ctx;
      [r._cachedFillStyle, r._cachedStrokeStyle] = cached;
    }
    // aurora and fireworks switch to 'lighter' themselves; composite the layer the same way so they still add up
    const op = lc.globalCompositeOperation;
    lc.restore();
    if (op !== 'source-over') ctx.globalCompositeOperation = op;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.filter = filter;
    ctx.drawImage(c, 0, 0);
  }

  // Paints the frame at project time t. Returns hit boxes for visual clips, top-most last:
  // [{ clipId, trackId, m: DOMMatrix (props transform, before in/out animation), w, h }]
  function renderFrame(p, project, t, opts = {}) {
    const { width: W, height: H, background } = project.settings;
    const ctx = p.drawingContext;
    const hits = [];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'none';
    ctx.clearRect(0, 0, W, H);
    if (background && background !== 'transparent') { ctx.fillStyle = P5M.rgba(background); ctx.fillRect(0, 0, W, H); }
    const cam = cameraMatrix(project, t);
    const ident = new DOMMatrix();

    for (let ti = project.tracks.length - 1; ti >= 0; ti--) {
      const tr = project.tracks[ti];
      if (tr.kind === 'audio' || tr.hidden) continue;
      if (opts.solo && opts.solo !== tr.id) continue;
      for (const clip of tr.clips) {
        if (!isActive(clip, t)) continue;
        const def = types[clip.type];
        if (!def || def.audio) continue;
        const lt = localTime(clip, t);
        const pr = resolveProps(clip, lt, project.settings);
        const st = P5M.animState(clip, t, { W, H });
        const env = { W, H, lt, t, st, clip, project, sx: 1, sy: 1 };

        p.push();
        if (def.screen) {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          drawClip(p, def, pr, env);
          p.pop();
          continue;
        }
        const base = tr.followCamera === false ? ident : cam;
        const m = base.translate(pr.x, pr.y).rotate(pr.rotation || 0).scale(pr.scale ?? 1);
        const b = def.bounds ? def.bounds.call(def, pr, env) : null;
        if (b) hits.push({ clipId: clip.id, trackId: tr.id, m, w: b.w, h: b.h });

        const alpha = clamp(pr.opacity ?? 1, 0, 1) * st.alpha;
        const fm = base.translate(pr.x + st.dx, pr.y + st.dy).rotate((pr.rotation || 0) + st.rot).scale((pr.scale ?? 1) * st.sx, (pr.scale ?? 1) * st.sy);
        if (alpha <= 0.001 || Math.abs(fm.a * fm.d - fm.b * fm.c) < 1e-9) { p.pop(); continue; }
        ctx.setTransform(fm);
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = clip.blend || 'source-over';
        env.sx = Math.hypot(fm.a, fm.b);
        env.sy = Math.hypot(fm.c, fm.d);
        const filter = filterString(pr, st.blur);
        const reveal = st.reveal && b ? st.reveal : null;
        if (filter !== 'none') drawFiltered(p, def, pr, env, filter, reveal, b);
        else {
          ctx.filter = 'none';
          if (reveal) clipReveal(ctx, reveal, b);
          drawClip(p, def, pr, env);
        }
        p.pop();
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.filter = 'none';
    return hits;
  }

  // Everything a p5 instance needs before the first frame: fonts, images, legacy iframes, 3D shaders
  async function prepare(p, project) {
    await P5M.assets.prepare(project);
    const has3d = project.tracks.some((tr) => tr.clips.some((c) => c.type === 'shape3d'));
    if (has3d && P5M.warm3d) P5M.warm3d(p, project.settings.width, project.settings.height);
  }

  Object.assign(P5M, { newProject, normalizeProject, contentEnd, cameraAt, cameraMatrix, renderFrame, prepare });
})();

</script>
<script>
// Real-time video export: plays the project once while MediaRecorder captures the canvas and the audio engine output.
// Same approach as the legacy engine.js exportVideo (MP4 on Chrome/Edge 130+, WebM fallback).
(function () {
  const P5M = window.P5M;

  const VIDEO_TYPES = [
    'video/mp4;codecs=avc1.640028,mp4a.40.2',
    'video/mp4;codecs=avc1,opus',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm',
  ];

  function pickType() {
    if (typeof MediaRecorder === 'undefined') return null;
    return VIDEO_TYPES.find((m) => MediaRecorder.isTypeSupported(m)) || null;
  }

  // opts: { canvas, project, from, to, render(t), onProgress(p), signal (AbortSignal) }
  // Resolves { blob, type, ext }. The caller must pause its own draw loop while this runs.
  async function recordVideo(opts) {
    const type = pickType();
    if (!type) throw new Error('此瀏覽器不支援影片錄製（請改用 Chrome 或 Edge）');
    const { canvas, project, render, onProgress, signal } = opts;
    const from = opts.from || 0;
    const to = opts.to ?? project.settings.duration;
    const fps = project.settings.fps || 30;

    const session = await P5M.audio.play(project, from, { record: true });
    const tracks = [...canvas.captureStream(fps).getVideoTracks()];
    if (session.stream) tracks.push(...session.stream.getAudioTracks());
    const stream = new MediaStream(tracks);
    const recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise((resolve, reject) => {
      recorder.onstop = resolve;
      recorder.onerror = (e) => reject(e.error || new Error('錄製失敗'));
    });
    render(from);
    recorder.start(1000);

    // Timer-driven, not rAF: rAF stops when the window is covered, timers keep running while the tab is visible
    let aborted = false;
    await new Promise((resolve) => {
      const tick = () => {
        if (signal && signal.aborted) { aborted = true; resolve(); return; }
        const t = Math.min(session.now(), to);
        render(t);
        if (onProgress) onProgress((t - from) / Math.max(0.001, to - from));
        if (t >= to) setTimeout(resolve, 300); // short tail so the last frame lands
        else setTimeout(tick, 1000 / fps);
      };
      tick();
    });
    recorder.stop();
    await stopped;
    stream.getTracks().forEach((tr) => tr.stop());
    P5M.audio.stop();
    if (aborted) return null;
    return { blob: new Blob(chunks, { type: type.split(';')[0] }), type, ext: type.startsWith('video/mp4') ? 'mp4' : 'webm' };
  }

  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  P5M.recorder = { VIDEO_TYPES, pickType, recordVideo, downloadBlob };
})();

</script>

<script>
// Standalone player for an exported project HTML.
// Reads <script type="application/json" id="p5maker-project">, renders with P5M.renderFrame, plays audio with P5M.audio.
// URL options: ?t=12.5 renders that frame frozen with no UI (baseline screenshots); ?autoplay=1 starts muted-safe playback.
(function () {
  const P5M = window.P5M;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const frozenT = params.has('t') ? parseFloat(params.get('t')) : null;

  const raw = $('p5maker-project');
  const project = P5M.normalizeProject(JSON.parse(raw.textContent));
  const { width: W, height: H, duration } = project.settings;

  const api = { project, t: 0, playing: false, frameReady: false, ready: null, seek, play, pause, render: null };
  window.P5M_PLAYER = api;

  const stageEl = $('p5m-stage');
  let pInst = null;
  let session = null;
  let raf = 0;
  let exporting = false;

  function render(t) {
    api.t = t;
    P5M.renderFrame(pInst, project, t);
    const bar = $('p5m-seek');
    if (bar && !bar.matches(':active')) bar.value = String(t);
    const lbl = $('p5m-time');
    if (lbl) lbl.textContent = P5M.fmtTime(t) + ' / ' + P5M.fmtTime(duration);
  }
  api.render = render;

  function loop() {
    if (!api.playing) return;
    const t = session ? session.now() : api.t;
    if (t >= duration) { render(duration); pause(); showOverlay('重新播放'); api.t = 0; return; }
    render(t);
    raf = requestAnimationFrame(loop);
  }

  async function play() {
    if (api.playing || exporting) return;
    hideOverlay();
    api.playing = true;
    setPlayIcon();
    session = await P5M.audio.play(project, api.t >= duration ? 0 : api.t);
    if (!api.playing) { P5M.audio.stop(); return; }
    raf = requestAnimationFrame(loop);
  }

  function pause() {
    api.playing = false;
    cancelAnimationFrame(raf);
    if (session) { api.t = Math.min(session.now(), duration); session = null; }
    P5M.audio.stop();
    setPlayIcon();
  }

  function seek(t) {
    const wasPlaying = api.playing;
    if (wasPlaying) pause();
    render(P5M.clamp(t, 0, duration));
    if (wasPlaying) play();
  }

  // ---------- UI ----------
  function setPlayIcon() { const b = $('p5m-play'); if (b) b.textContent = api.playing ? '❚❚' : '▶'; }
  function showOverlay(label) { const o = $('p5m-overlay'); o.querySelector('span').textContent = label; o.hidden = false; }
  function hideOverlay() { $('p5m-overlay').hidden = true; }
  function setStatus(msg) { const s = $('p5m-status'); s.textContent = msg || ''; s.hidden = !msg; }

  async function exportVideo() {
    if (exporting) return;
    pause();
    exporting = true;
    document.body.classList.add('p5m-exporting');
    try {
      const res = await P5M.recorder.recordVideo({
        canvas: pInst.canvas, project, from: 0, to: duration, render,
        onProgress: (p) => setStatus('錄製中 ' + Math.round(p * 100) + '%（請保持此分頁在前景）'),
      });
      const name = (document.title || 'animation').replace(/[\\/:*?"<>|]/g, '_') + '.' + res.ext;
      P5M.recorder.downloadBlob(res.blob, name);
      setStatus('已下載 ' + name);
      setTimeout(() => setStatus(''), 4000);
    } catch (err) {
      console.error('匯出影片失敗', err);
      setStatus('匯出失敗：' + err.message);
    } finally {
      exporting = false;
      document.body.classList.remove('p5m-exporting');
      render(0);
      showOverlay('播放');
    }
  }

  function bindUI() {
    const bar = $('p5m-seek');
    bar.max = String(duration);
    bar.step = String(1 / (project.settings.fps || 30));
    bar.addEventListener('input', () => { if (api.playing) pause(); render(parseFloat(bar.value)); });
    $('p5m-play').addEventListener('click', () => (api.playing ? pause() : play()));
    $('p5m-overlay').addEventListener('click', play);
    $('p5m-export').addEventListener('click', exportVideo);
    $('p5m-full').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); api.playing ? pause() : play(); }
    });
    let idle = 0;
    document.addEventListener('pointermove', () => {
      document.body.classList.remove('p5m-idle');
      clearTimeout(idle);
      idle = setTimeout(() => { if (api.playing) document.body.classList.add('p5m-idle'); }, 2200);
    });
  }

  api.ready = new Promise((resolve) => {
    pInst = new p5((p) => {
      p.setup = async () => {
        pInst = p; // p5 may run setup inside its constructor, before the assignment below returns
        p.pixelDensity(1);
        p.createCanvas(W, H);
        p.noLoop();
        P5M.assets.onReady = () => { if (!api.playing && !exporting) render(api.t); };
        setStatus('載入中…');
        await P5M.prepare(p, project);
        setStatus('');
        if (frozenT !== null) {
          document.body.classList.add('p5m-frozen');
          render(P5M.clamp(frozenT, 0, duration));
          api.frameReady = true;
          document.body.dataset.ready = '1';
        } else {
          bindUI();
          render(0);
          if (params.get('autoplay') === '1') play(); else showOverlay('播放');
        }
        resolve(api);
      };
    }, stageEl);
  });
})();

</script>
